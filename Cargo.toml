[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[workspace.dependencies]
# Shared dependencies
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
# The workspace's only state machine library, declared once so that every
# crate with a lifecycle to police links the same copy and the same tables.
# Two versions used to sit in the tree, which meant two `State` types that
# could not be compared and two builds of the same crate.
yasm = { version = "0.6.0", features = ["serde"] }
deis-wire = { path = "crates/deis-wire" }
deis-build-core = { path = "crates/deis-build-core" }
deis-provider-driver = { path = "crates/deis-provider-driver" }
