[workspace]
members = [
    "crates/*",
    "tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[workspace.dependencies]
# Shared dependencies
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
deis-wire = { path = "crates/deis-wire" }
