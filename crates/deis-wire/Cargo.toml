[package]
name = "deis-wire"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]
description = "Shared wire types and conventions for talking to the deislet control plane"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
hex = "0.4.3"
pwrzv = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_jcs = "0.2.0"
sha2 = "0.10.9"
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"
# Not just for tests any more: `logging::LineSafe` is a `MakeWriter`, which is
# `fmt`'s trait, and every binary in the workspace installs it. Default
# features are what `fmt` needs; `json` is a test-only addition below, for the
# one test that checks what protects deis-control's `LOG_FORMAT=json` branch.
tracing-subscriber = "0.3.18"
uuid = { version = "1.17.0", features = ["v4", "v7", "serde"] }
yasm = { workspace = true }
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3.18", features = ["json"] }
# The in-process control plane `client`'s tests speak to is a real tonic
# server on a real socket, and `TcpListenerStream` - the adapter that turns a
# bound listener into the stream `serve_with_incoming` takes - is behind
# tokio-stream's "net" feature. Named here rather than added to the dependency
# above so a build that is not running tests does not carry it.
tokio-stream = { version = "0.1", features = ["net"] }

