[package]
name = "deis-wire"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]
description = "Shared wire types and conventions for talking to the deislet control plane"

[dependencies]
async-trait = "0.1.83"
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
pwrzv = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
yasm = { workspace = true }
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tracing-subscriber = "0.3.18"

