[package]
name = "deis-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[dependencies]
deis-wire = { workspace = true }
deis-node-contract = { path = "../deis-node-contract" }
# Machine identity for the mutual-TLS migration replacing node_preshared_keys.
# Not called from this crate yet -- the dependency is being taken as its own
# reviewable step, ahead of the change that moves authentication over to it.
deis-identity = { path = "../deis-identity" }
# The command line. Every other component of this platform takes `-c`, and a
# binary that read no arguments at all answered `-c /etc/deis-runtime.toml`
# and `--help` by starting an unconfigured node on default ports and calling
# itself ready.
clap = { version = "4.5", features = ["derive"] }
# The bundle format: deis-build writes it, deis-control verifies it, this crate
# loads it. One definition for all three.
deis-bundle = { path = "../deis-bundle" }
# Async runtime
tokio = { version = "1.48", features = ["full"] }

# HTTP framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Deno Runtime
deno_runtime = { version = "0.266", features = ["transpile"] }

# Deno Core (for op2 macro compatibility)
deno_core = "0.411"

# These are already part of deno_runtime's graph. Deislet names them directly
# to initialize the selected Edge Canon surface without enabling a general
# runtime npm resolver.
deno_node_crypto = "0.28"
deno_resolver = "0.89"

# System Traits (for permissions)
sys_traits = "0.1.22"

# Serialization

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Time
chrono = "0.4"

# Concurrent data structures
dashmap = "5.5"

# High-performance cache
moka = { version = "0.12", features = ["future"] }

# Configuration storage
rusqlite = { workspace = true }
arc-swap = "1.7"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
once_cell = "1.21"
num_cpus = "1.17"
uuid = { version = "1.12", features = ["v4"] }

# gRPC and Protocol Buffers
tonic = "0.12"
prost = "0.13"

# HTTP client
# "stream" is what lets a bundle be hashed and written to disk as it
# arrives, instead of being buffered whole in memory first.
reqwest = { version = "0.12", features = ["json", "stream"] }

# The DNS half of the outbound fetch policy. `deno_fetch::dns::Resolve` is
# written in terms of hyper-util's `Name`, so a custom resolver has to be
# implemented against the same crate deno_fetch links; the workspace lock keeps
# it on the one version already in the graph.
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }

# WebSocket client, with no TLS backend of its own on purpose.
#
# `runtime/ws_client_ops.rs` resolves the destination, asks the outbound fetch
# policy about the address it is about to dial, opens the socket itself and,
# for `wss://`, wraps it with a rustls session built by `deno_tls` before
# handing the finished stream to `client_async_with_config`. Turning on
# `__rustls-tls` here therefore bought no capability and instead pinned a
# second rustls (0.22) beside the one deno already links, and with it
# rustls-webpki 0.102 - RUSTSEC-2026-0049/-0098/-0099/-0104. Dropping the
# feature removes rustls 0.22 and tokio-rustls 0.25 from the tree, but not
# those four advisories: the deno fork's workspace also pins
# `rustls-webpki = "0.102"`, which deno_fetch and deno_tls both take, so they
# stay until the fork moves.
#
# 0.24 is the version axum already brings, so this is also the version that
# keeps exactly one tokio-tungstenite in the workspace.
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Base64 encoding
base64 = "0.22"

# Reference-counted byte buffers. Static assets are held once per version and
# handed to a response per request; `Bytes` makes that a refcount bump instead
# of copying the file for every hit.
bytes = "1"


# System information
hostname = "0.4"

# Cryptography and hashing
sha2 = "0.10"
hex = "0.4"

# ZIP archive handling
zip = "0.6"
parking_lot = "0.12.5"
fs2 = "0.4"
deno_ast = { version = "0.52.0", features = ["transpiling", "visit"] }
deno_error = "0.7.1"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "=3.2.0"
deno_core = "0.411"
deno_runtime = { version = "0.266", features = ["transpile"] }
deno_node_crypto = "0.28"
deno_resolver = "0.89"
sys_traits = "0.1.22"
sha2 = "0.10"

[dev-dependencies]
# Test dependencies
# V8 requires one process-wide parent for its isolate thread families. The
# pre-main hook also serializes independent libtest bodies; concurrency inside
# each RuntimePool remains enabled and tested.
ctor = "=1.0.13"
# `test-util` gives tests a paused clock, so the log shipper's retry backoff can
# be asserted without the test actually waiting those seconds. Resolver 2 keeps
# the feature out of the normal build.
tokio = { version = "1.48", features = ["test-util"] }
# The blob client speaks a streaming contract owned by deis-store. Running it
# against the real server in tests is what catches a change on that side; unit
# tests on either half alone cannot.
deis-store = { path = "../deis-store" }
# The same reasoning for the telemetry credential: this node derives a token
# over a subject and deis-telemetry recomputes it over its own, and nothing but
# a push to the real collector proves the two strings agree. Test-only -- the
# node does not link the collector's server, its database or its HTTP stack.
deis-telemetry = { path = "../deis-telemetry" }
hyper = "1.7"
tower = "0.5"
tempfile = "3"
http-body-util = "0.1"
# Resolver order may send `localhost` to IPv4 or IPv6. The hostname-policy
# WebSocket test needs one dual-stack listener so it verifies policy rather
# than whichever address family a given CI image listed first.
socket2 = "0.6"

[lib]
name = "deis_runtime"
path = "src/lib.rs"
