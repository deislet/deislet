# Runtime configuration file
# Autonomous JavaScript runtime platform

# HTTP service port (used for both HTTP traffic and the gRPC management interface)
http_port = 8000

# Data directory (stores configuration, log buffers, etc.)
# Can be overridden via the DEIS_RUNTIME_DATA_DIR environment variable
# data_dir = "./data"

# Platform-wide default execution limits for app isolates. An individual app
# may override either value via its own ResourceLimits config; these are only
# the fallback used when it does not.
[limits]
# Maximum wall-clock time (ms) a single fetch invocation may run before the
# isolate is terminated and the request fails.
# Can be overridden via the DEIS_RUNTIME_DEFAULT_TIMEOUT_MS environment variable
timeout_ms = 30000

# Maximum rate (ops/sec) of JS-op dispatch before the isolate is terminated
# and the in-flight request fails.
# Can be overridden via the DEIS_RUNTIME_DEFAULT_RATE_LIMIT_OPS_PER_SEC environment variable
rate_limit_ops_per_sec = 1000.0

# Logging configuration (optional)
[logging]
# Whether log shipping is enabled
enabled = false

# Log service endpoint (to be implemented)
# endpoint = "http://log-service:9000"

# Buffer size
buffer_size = 10000

# Flush interval (seconds)
flush_interval = 5

# Maximum number of logs per batch
batch_size = 100

# Maximum number of retries
max_retries = 3
