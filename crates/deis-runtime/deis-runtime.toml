# deis-runtime node configuration.
#
# Every setting below can also be given as an environment variable, whose name
# is the TOML path with "DEIS_RUNTIME_" in front, upper-cased and joined by
# underscores: "http_port" is DEIS_RUNTIME_HTTP_PORT, and
# "[default_execution_limits] timeout_ms" is
# DEIS_RUNTIME_DEFAULT_EXECUTION_LIMITS_TIMEOUT_MS. There are no aliases, so the
# guess made from the TOML key always works. DEIS_RUNTIME_CONFIG, which selects
# this file, is the only variable that names no setting.
#
# Values are validated at startup; an out-of-range value stops the node with an
# explanation instead of failing every request later.

# How this node names itself to the control plane. Unset means "use the
# hostname". Two nodes on one host must each be given a distinct id, or they
# would ask for and report on the same assignment list.
# node_id = "node-a"

# Port serving both HTTP traffic and the gRPC management interface.
http_port = 8000

# Directory holding this node's SQLite database and other local state.
data_dir = "./data"

# How long a SIGINT/SIGTERM gives in-flight requests to finish before the node
# stops waiting and exits anyway.
shutdown_grace_period_secs = 30

# Largest request body this node will read, in bytes. A request that declares
# more in Content-Length, or that turns out to send more, is answered 413 and
# never reaches an application.
#
# The body is buffered whole before a handler sees it -- application code is
# given a Request it can call arrayBuffer() on, not a stream -- so this number
# is the ceiling on what one request can cost this node in resident memory, and
# a node runs many requests at once beside every tenant's isolates. Without it
# a single upload decides how much memory the node has left. An application
# that needs to take larger uploads should take them through blob storage,
# which receives the bytes directly instead of through the node.
#
# Must be greater than 0; 0 would answer 413 to every request carrying a body.
max_request_body_bytes = 33554432

# Ceiling on the V8 heap of one isolate, in MB. Every application on this node
# is held to it, including one whose deployment sets no limits at all: without
# a value here an application that allocates without bound grows until the node
# process is killed, and every other application in that process dies with it.
#
# An application's own ResourceLimits.memory_mb may ask for less than this and
# gets what it asked for. One asking for more is refused and held to this
# value: the node's memory is what is being protected, so no tenant widens it.
#
# It is not part of [default_execution_limits] because those bound a single
# invocation and are re-armed per request, while a heap belongs to the isolate
# and outlives every request that runs in it.
#
# Must be at least 32; below that the runtime's own bootstrap exhausts the heap
# and no application would ever run.
default_memory_limit_mb = 256

# Default execution limits applied to each app's isolate. An individual app may
# override timeout_ms, rate_limit_ops_per_sec and cpu_time_limit_ms through its
# own ResourceLimits; these are the fallback used when it does not. The CPU
# ceiling narrows only -- see below -- and wait_until_timeout_ms and
# stream_timeout_ms have no per-app override at all.
[default_execution_limits]
# Maximum wall-clock time (ms) a single fetch invocation may run before the
# isolate is terminated and the request fails. Must be at least 100.
timeout_ms = 30000

# Maximum CPU time (ms) one invocation may spend on the thread running it,
# before the isolate is terminated. Must be at least 100.
#
# A separate ceiling from timeout_ms, and the one that measures what this node
# actually pays. A handler waiting 25 seconds on a slow upstream and a handler
# spinning for 25 seconds are the same thing to a wall clock and differ by
# orders of magnitude to the machine: the first costs a parked thread, the
# second holds a core that every other application on this node is queued
# behind.
#
# An application's own ResourceLimits.cpu_time_limit_ms may ask for less and
# gets what it asked for. One asking for more is refused and held to this
# value: CPU time is the node's resource, so no tenant widens it.
#
# Set at or above timeout_ms it can never fire, because one thread cannot spend
# more CPU time than wall-clock time; the node says so per application at
# startup rather than leaving it to be noticed.
#
# Enforced by sampling the running thread's CPU clock in /proc. On a platform
# without one -- macOS, Windows, a container with /proc hidden -- the node logs
# an error at startup saying this ceiling is not in force, and the wall-clock
# timeout is the only one left.
cpu_time_limit_ms = 5000

# Maximum wall-clock time (ms) the waitUntil tail of one invocation may run
# after the response has already been sent. Must be at least 100.
#
# Its own budget rather than what is left of timeout_ms: the tail is meant to
# outlive the response, so measuring it against the request's budget would
# refuse every tail. No per-app override; every application on this node is
# held to the value set here.
wait_until_timeout_ms = 30000

# Maximum wall-clock time (ms) one streaming response body may take, counted
# from the moment its head reached the client. Must be at least 100.
#
# A handler that answers with a ReadableStream is answered immediately and
# writes its body afterwards, chunk by chunk. timeout_ms is the wrong ceiling
# for that: it bounds how long a caller waits for an answer, and this body has
# already been answered. A server-sent-events feed, a progress channel or a
# large object being passed through is expected to run for minutes.
#
# It still needs one, because an open stream is a queue, a socket and a
# producer this node holds on the application's behalf. When it runs out the
# node closes the stream: the client's transfer fails part-way -- there is no
# status left to change, the 200 went out with the head -- and the node logs
# the number it was held to. Enforced by the node rather than by terminating
# the isolate, so one overrunning stream does not take the other streams and
# requests of the same application with it.
#
# No per-app override; every application on this node is held to the value set
# here.
#
# One further ceiling applies to a stream without being named here: one chunk
# costs one op dispatch, so rate_limit_ops_per_sec bounds how many chunks a
# second a producer may write. An application writing very small chunks meets
# that ceiling long before it meets any byte rate, and is told so by name.
stream_timeout_ms = 300000

# Maximum rate (ops/sec) of JS-op dispatch before the isolate is terminated and
# the in-flight request fails. Must be a finite value greater than 0.
rate_limit_ops_per_sec = 1000.0

# Most outbound calls one invocation may make before the next one is refused.
# Must be at least 1.
#
# The ceiling that bounds fan-out, which none of the others reaches. An
# invocation answering one inbound request with two hundred outbound ones is
# spending this node's sockets and outbound bandwidth, both shared with every
# other tenant on the box, while looking healthy on everything above: the calls
# run concurrently, so the wall clock sees one slow request, the CPU clock sees
# almost nothing, and the op rate limit sees a couple of hundred dispatches
# spread over a second.
#
# Counted per armed stretch of application code -- a request together with its
# waitUntil tail, one queue batch, one cron tick, one WebSocket message. Every
# destination actually dialled costs one, and a redirect chain costs one per
# hop, because this platform follows redirects itself and each hop is a
# separate connection. An outbound WebSocket spends the same allowance.
#
# An application's own limits.max_subrequests may ask for less and gets what it
# asked for; one asking for more is refused and held to this value.
max_subrequests = 50

# Log shipping to deis-telemetry. While disabled, this node's logs exist only in
# its own output; "deis tail" shows nothing for it.
[logging]
enabled = false

# deis-telemetry LogService address. Required whenever enabled is true; leaving
# it unset with shipping enabled stops the node rather than silently dropping
# every entry.
# endpoint = "http://127.0.0.1:8092"

# Entries held in memory before the oldest are dropped to make room.
buffer_size = 10000

# Seconds between flush attempts.
flush_interval_secs = 5

# Maximum entries sent in one PushLogs call.
batch_size = 100

# Attempts per batch before it is given up on.
max_retries = 3

# Ceiling on the retry queue (entries taken out of the buffer but not yet
# accepted by deis-telemetry). Once full, the node stops draining the buffer, so
# a telemetry outage costs old logs rather than memory. Must be at least
# batch_size.
max_pending_entries = 10000

# How this node reaches the control plane: it announces itself, asks what it
# should be running, and keeps matching the answer.
#
# On startup it sends PUT <endpoint>/api/nodes/<node_id>/registration so the
# control plane knows this node exists without an operator editing anything on
# that side, then calls GET <endpoint>/api/nodes/<node_id>/assignments, downloads
# and loads every version named there, and only then reports healthy. Neither
# path is spelled out in the code: both come from
# deis_wire::conventions::{node_registration_path, node_assignments_path}, so
# the two sides cannot drift apart. After that it
# re-asks on a timer (reconcile_interval_secs). With no endpoint set the node
# never asks anyone: it runs what is already in its bundle directory plus
# whatever is pushed to it, and reports healthy immediately.
#
# A node that cannot reach the control plane keeps serving what it recovered
# from its own disk, says so at error level, reports UNHEALTHY, and retries with
# a growing delay. Bundles on disk carry no secrets, so an app that declares any
# runs without them until the control plane redelivers. Once contact comes back
# it registers again, because a control plane that restarted may have forgotten
# it.
[control]
# endpoint = "http://127.0.0.1:8080"

# One of the control plane's node_preshared_keys. The assignment list carries
# this node's decrypted secrets, so a control plane that has node keys
# configured refuses to serve it - and the bundle download - to a caller that
# cannot present one; without this the node gets 401 and never loads a version
# it was assigned. It is only ever sent to the endpoint above.
# secret = "the-same-value-as-the-control-plane-node_preshared_keys"

# Seconds one assignment request may take before it is abandoned.
request_timeout_secs = 30

# Seconds before the first retry after a failure. Later retries back off from
# here, up to twenty times this value.
retry_interval_secs = 15

# Seconds between reconciliations once the node is up. Each one re-asks for the
# assignment list and treats it as the whole truth: versions this node is not
# running are loaded, and environments the list no longer names stop serving
# here and have their bundles removed. Without it, an application deleted from
# the catalog while this node was unreachable would keep serving - with its
# secrets - until the process was restarted. A pass that finds nothing to change
# does nothing and logs nothing.
reconcile_interval_secs = 60

# Downloaded application bundles.
[bundles]
# Directory holding them. Unset means "<data_dir>/bundles".
# dir = "./data/bundles"

# Largest bundle this node accepts. A download is cut off the moment it goes
# over, so a wrong or hostile URL cannot fill the disk.
max_bytes = 268435456

# Seconds one download may take before it is abandoned and the version already
# running is kept.
download_timeout_secs = 300

# Serving the static files a bundle carries. A request whose path names one of
# them is answered from it and never reaches an isolate.
[assets]
# Sent with every asset. The default revalidates on each request and lets the
# ETag (the asset's sha256) turn that into a 304 with no body. Bundle paths are
# not content-addressed, so a long max-age here would pin a stale file in
# browser caches across a deploy.
cache_control = "public, max-age=0, must-revalidate"

# Ceiling on the assets of one version, which are held in memory so that serving
# one does not reopen the zip. A version above it is refused and whatever is
# already running stays up.
max_bytes = 134217728

# Where an application's outbound fetch() may go.
#
# Deny by default: an application may reach public internet destinations and
# nothing else. Loopback, the private ranges, link-local (the cloud metadata
# service), unique-local IPv6, multicast and the reserved ranges are all
# refused, and the check is on the address a name resolves to, not on the name.
# Without that, an application could POST to this node's own deis-store with
# any tenant header it liked and read every other application's data.
[fetch]
# Non-public destinations applications on this node may nevertheless reach,
# written as "host", "host:port" or a whole URL. An entry with no port covers
# every port on that host. Empty, the default, means public destinations only.
#
# This cannot be widened into the platform's own services: deis-store,
# deis-queue, deis-control and deis-telemetry are refused after this list has
# been consulted, so an entry that happens to cover one of them still does not
# reach it.
allow = []

# Whether an HTTP proxy named in this node's environment (HTTP_PROXY,
# HTTPS_PROXY, ALL_PROXY) may carry applications' outbound calls.
#
# false, the default, takes those variables out of the process environment at
# startup and logs at warn what was removed. deno_fetch reads them
# unconditionally when it builds an application's HTTP client and offers no way
# to say no, so left in place they -- not this file -- decide where every
# fetch() actually connects. This node's own control-plane traffic is
# unaffected: the values are captured before they are removed and handed to the
# node's own clients explicitly.
#
# true puts it back for applications too. The cost is specific: a proxied
# connection dials the proxy and carries the destination as a CONNECT target,
# so the outbound policy's DNS resolver never sees the destination's addresses
# and the DNS-rebinding guarantee is gone for application traffic. The
# pre-flight check on the URL, and the refusal of this platform's own
# endpoints, are unaffected. The trade is logged at warn on every start.
proxy_from_env = false
