# deis-runtime node configuration.
#
# Every setting below can also be given as an environment variable, whose name
# is the TOML path with "DEIS_RUNTIME_" in front, upper-cased and joined by
# underscores: "http_port" is DEIS_RUNTIME_HTTP_PORT, and
# "[default_execution_limits] timeout_ms" is
# DEIS_RUNTIME_DEFAULT_EXECUTION_LIMITS_TIMEOUT_MS. There are no aliases, so the
# guess made from the TOML key always works. DEIS_RUNTIME_CONFIG, which selects
# this file, is the only variable that names no setting.
#
# Values are validated at startup; an out-of-range value stops the node with an
# explanation instead of failing every request later.

# How this node names itself to the control plane. Unset means "use the
# hostname". Two nodes on one host must each be given a distinct id, or they
# would ask for and report on the same assignment list.
# node_id = "node-a"

# Port serving both HTTP traffic and the gRPC management interface.
http_port = 8000

# Directory holding this node's SQLite database and other local state.
data_dir = "./data"

# How long a SIGINT/SIGTERM gives in-flight requests to finish before the node
# stops waiting and exits anyway.
shutdown_grace_period_secs = 30

# Default execution limits applied to each app's isolate. An individual app may
# override either value through its own ResourceLimits; these are the fallback
# used when it does not.
[default_execution_limits]
# Maximum wall-clock time (ms) a single fetch invocation may run before the
# isolate is terminated and the request fails. Must be at least 100.
timeout_ms = 30000

# Maximum rate (ops/sec) of JS-op dispatch before the isolate is terminated and
# the in-flight request fails. Must be a finite value greater than 0.
rate_limit_ops_per_sec = 1000.0

# Log shipping to deis-telemetry. While disabled, this node's logs exist only in
# its own output; "deis tail" shows nothing for it.
[logging]
enabled = false

# deis-telemetry LogService address. Required whenever enabled is true; leaving
# it unset with shipping enabled stops the node rather than silently dropping
# every entry.
# endpoint = "http://127.0.0.1:8092"

# Entries held in memory before the oldest are dropped to make room.
buffer_size = 10000

# Seconds between flush attempts.
flush_interval_secs = 5

# Maximum entries sent in one PushLogs call.
batch_size = 100

# Attempts per batch before it is given up on.
max_retries = 3

# Ceiling on the retry queue (entries taken out of the buffer but not yet
# accepted by deis-telemetry). Once full, the node stops draining the buffer, so
# a telemetry outage costs old logs rather than memory. Must be at least
# batch_size.
max_pending_entries = 10000

# How this node reaches the control plane to ask what it should be running.
#
# On startup it calls GET <endpoint>/api/nodes/<node_id>/assignments, downloads
# and loads every version named there, and only then reports healthy. With no
# endpoint set the node never asks anyone: it runs what is already in its bundle
# directory plus whatever is pushed to it, and reports healthy immediately.
#
# A node that cannot reach the control plane keeps serving what it recovered
# from its own disk, says so at error level, reports UNHEALTHY, and retries with
# a growing delay. Bundles on disk carry no secrets, so an app that declares any
# runs without them until the control plane redelivers.
[control]
# endpoint = "http://127.0.0.1:8080"

# One of the control plane's node_preshared_keys. The assignment list carries
# this node's decrypted secrets, so a control plane that has node keys
# configured refuses to serve it - and the bundle download - to a caller that
# cannot present one; without this the node gets 401 and never loads a version
# it was assigned. It is only ever sent to the endpoint above.
# secret = "the-same-value-as-the-control-plane-node_preshared_keys"

# Seconds one assignment request may take before it is abandoned.
request_timeout_secs = 30

# Seconds before the first retry after a failure. Later retries back off from
# here, up to twenty times this value.
retry_interval_secs = 15

# Downloaded application bundles.
[bundles]
# Directory holding them. Unset means "<data_dir>/bundles".
# dir = "./data/bundles"

# Largest bundle this node accepts. A download is cut off the moment it goes
# over, so a wrong or hostile URL cannot fill the disk.
max_bytes = 268435456

# Seconds one download may take before it is abandoned and the version already
# running is kept.
download_timeout_secs = 300

# Serving the static files a bundle carries. A request whose path names one of
# them is answered from it and never reaches an isolate.
[assets]
# Sent with every asset. The default revalidates on each request and lets the
# ETag (the asset's sha256) turn that into a 304 with no body. Bundle paths are
# not content-addressed, so a long max-age here would pin a stale file in
# browser caches across a deploy.
cache_control = "public, max-age=0, must-revalidate"

# Ceiling on the assets of one version, which are held in memory so that serving
# one does not reopen the zip. A version above it is refused and whatever is
# already running stays up.
max_bytes = 134217728
