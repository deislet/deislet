syntax = "proto3";

package deis.management;

// Runtime management service - receives control commands from the control
service RuntimeManagement {
    // Control pushes configuration
    rpc PushConfig(PushConfigRequest) returns (PushConfigResponse);

    // Control tells the node which version of an app that node should be
    // running. Small message, pointer only: the node fetches the bundle
    // itself over HTTP (docs/implementation-plan.zh.md section 4).
    rpc ApplyDeployment(ApplyDeploymentRequest) returns (ApplyDeploymentResponse);

    // Control unloads an app
    rpc UnloadApp(UnloadAppRequest) returns (UnloadAppResponse);

    // Control updates an app
    rpc UpdateApp(UpdateAppRequest) returns (UpdateAppResponse);

    // Control queries status
    rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

    // Control executes a command
    rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);

    // Health check
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

    // Start an inspect (debug) session
    rpc StartInspect(StartInspectRequest) returns (StartInspectResponse);
}

// ============ Inspect management ============

message StartInspectRequest {
    string app_id = 1;
    // Inspect session TTL (seconds), defaults to 300 seconds
    int32 ttl_seconds = 2;
}

message StartInspectResponse {
    // Inspect app ID (e.g. _inspect:<app_id>)
    string inspect_app_id = 1;
    // Inspect token (must be sent in the x-deis-inspect-token header)
    string token = 2;
}

// ============ Configuration management ============

// Push configuration request
message PushConfigRequest {
    // Configuration version number
    int64 version = 1;

    // Configuration content (JSON format)
    string config_json = 2;

    // Configuration type
    ConfigType config_type = 3;

    // Whether to force the update
    bool force = 4;
}

// Configuration type
enum ConfigType {
    CONFIG_TYPE_UNSPECIFIED = 0;
    GLOBAL = 1;      // Global configuration
    APP = 2;         // Application configuration
    RESOURCE = 3;    // Resource configuration
}

// Push configuration response
message PushConfigResponse {
    bool success = 1;
    string message = 2;
    int64 applied_version = 3;
}

// ============ Application management ============

// Apply one deployment on this node.
//
// This carries a pointer, never a payload. The control plane decides which
// version an environment should run and says so here; the node downloads
// `bundle_url` itself, checks it against `bundle_sha`, and only then loads
// it. Pushing the zip through gRPC instead - which is what the removed
// DeployApp did - put a whole application inside one message and hit the
// tonic size ceiling as soon as an app carried real assets.
message ApplyDeploymentRequest {
    // Application this deployment belongs to; the only tenant dimension
    // the storage services ever see.
    string app_id = 1;

    // Immutable version being deployed. Echoed back in the response so the
    // control plane can tell an applied version from a stale one.
    string version_id = 2;

    // Environment name, "production" or a preview name. Never an id: this
    // is the name the application code branches on.
    string environment = 3;

    // Absolute HTTP URL the node downloads the bundle from, on the control
    // plane that sent this request.
    string bundle_url = 4;

    // Hex sha256 of the bundle. The node must verify the bytes it
    // downloaded against this before loading anything from them.
    string bundle_sha = 5;

    // Environment variables plus decrypted secret values, merged into one
    // dictionary and injected as `context.env`.
    //
    // Secret values exist in the clear only here, in flight, and in the
    // node's memory. They are never written to the bundle, never stored
    // decrypted, never returned by a read API, and must never be logged -
    // logging this message as a whole would print every one of them.
    map<string, string> env = 6;
}

// Apply deployment response
message ApplyDeploymentResponse {
    // False means the node is still running whatever it ran before.
    bool success = 1;

    // What happened, for the control plane's log and API answer. Must not
    // echo any value from the env map.
    string message = 2;

    // Version the node is running for this app and environment now. Equal
    // to the requested version_id on success; on failure it is whatever
    // the node kept running, which is what makes a rejected deployment
    // readable rather than merely failed.
    string version_id = 3;
}

// Application configuration
message AppConfig {
    // Environment variables
    map<string, string> env = 1;

    // Resource limits
    ResourceLimits limits = 2;

    // Routing rules
    repeated RouteRule routes = 3;
}

// Resource limits
message ResourceLimits {
    // Memory limit (MB)
    int32 memory_mb = 1;

    // CPU limit (millicores)
    int32 cpu_milli = 2;

    // Maximum concurrent requests
    int32 max_concurrency = 3;

    // Maximum number of ResourceTable entries
    int32 resource_table_max = 4;

    // Per-app override of the platform default execution timeout (ms).
    // 0 means "use the platform default".
    int64 timeout_ms = 5;

    // Per-app override of the platform default JS-op rate limit (ops/sec).
    // 0 means "use the platform default".
    double rate_limit_ops_per_sec = 6;
}

// Routing rule.
//
// The runtime uses these only to fill `context.params`; they do not select an
// app (deis-proxy does that) and they do not gate a request.
message RouteRule {
    // Route pattern, spelled exactly as the app bundle manifest spells it in
    // `routes[].pattern` (docs/implementation-plan.zh.md section 2).
    //
    // Exact segments plus `:name` placeholders, for example "/api/users/:id".
    // The edge-canon spec also defines a catch-all (a `[[catch]].ts` file maps
    // to "/api/*"), which the matcher in
    // crates/deis-runtime/src/runtime/route_match.rs does NOT yet implement:
    // such a pattern currently matches nothing, and the only symptom is an
    // empty `context.params`. Catch-all support is wave B work.
    string pattern = 1;

    // Methods this rule applies to. Empty means any method.
    //
    // Currently ignored by the runtime: a request reaches the app whatever its
    // method, and the app decides. Method-aware route selection is wave B work.
    repeated string methods = 2;
}

// Unload app request
message UnloadAppRequest {
    string app_id = 1;
}

// Unload app response
message UnloadAppResponse {
    bool success = 1;
    string message = 2;
}

// Update app request
message UpdateAppRequest {
    string app_id = 1;
    // Application ZIP package data
    bytes package_data = 2;
    // Application config (optional; overrides the config in the manifest)
    AppConfig config = 3;
}

// Update app response
message UpdateAppResponse {
    bool success = 1;
    string message = 2;
}

// ============ Status queries ============

// Get status request
message GetStatusRequest {
    // Whether to include app details
    bool include_apps = 1;
}

// Get status response
message GetStatusResponse {
    // Basic worker info
    NodeInfo node_info = 1;

    // Application list
    repeated AppStatus apps = 2;

    // System resource usage
    ResourceUsage resource_usage = 3;

    // Per-app OpMetrics summary
    repeated AppOpMetrics op_metrics = 4;
}

// Per-app OpMetrics summary
message AppOpMetrics {
    string app_id = 1;
    OpMetricsSummary summary = 2;
}

// OpMetrics summary
message OpMetricsSummary {
    uint64 ops_dispatched_sync = 1;
    uint64 ops_dispatched_async = 2;
    uint64 ops_dispatched_fast = 3;
    uint64 ops_completed_async = 4;
}

// Worker info
message NodeInfo {
    string node_id = 1;
    string version = 2;
    int64 uptime_seconds = 3;
    string hostname = 4;
}

// Application status
message AppStatus {
    string app_id = 1;
    AppState state = 2;
    int64 request_count = 3;
    int64 error_count = 4;
    string error_message = 5;
}

// Application state enum
enum AppState {
    APP_STATE_UNSPECIFIED = 0;
    LOADING = 1;
    RUNNING = 2;
    STOPPED = 3;
    ERROR = 4;
}

// Resource usage
message ResourceUsage {
    double cpu_percent = 1;
    int64 memory_bytes = 2;
    int64 goroutines = 3;
}

// ============ Command execution ============

// Execute command request
message ExecuteCommandRequest {
    string command = 1;
    repeated string args = 2;
    map<string, string> options = 3;
}

// Execute command response
message ExecuteCommandResponse {
    bool success = 1;
    string output = 2;
    string error = 3;
}

// ============ Health check ============

// Health check request
message HealthCheckRequest {}

// Health check response
message HealthCheckResponse {
    bool healthy = 1;
    string version = 2;
    map<string, string> details = 3;
}
