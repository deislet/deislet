syntax = "proto3";

package deis.management;

// Runtime management service - receives control commands from the control
service RuntimeManagement {
    // Control pushes configuration
    rpc PushConfig(PushConfigRequest) returns (PushConfigResponse);

    // Control tells the node which version of an app that node should be
    // running. Small message, pointer only: the node fetches the bundle
    // itself over HTTP (docs/implementation-plan.zh.md section 4).
    rpc ApplyDeployment(ApplyDeploymentRequest) returns (ApplyDeploymentResponse);

    // Control unloads an app
    rpc UnloadApp(UnloadAppRequest) returns (UnloadAppResponse);

    // Control updates an app
    rpc UpdateApp(UpdateAppRequest) returns (UpdateAppResponse);

    // Control queries status
    rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

    // Control executes a command
    rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);

    // Health check
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

    // Start an inspect (debug) session
    rpc StartInspect(StartInspectRequest) returns (StartInspectResponse);
}

// ============ Inspect management ============

message StartInspectRequest {
    string app_id = 1;
    // Inspect session TTL (seconds), defaults to 300 seconds
    int32 ttl_seconds = 2;

    // Which environment of that application to attach to. Empty means the
    // default environment ("production"), which is what a caller that says
    // nothing means; a node runs every environment of an app at once, so
    // without this a preview could not be inspected at all.
    string environment = 3;
}

message StartInspectResponse {
    // Inspect app ID (e.g. _inspect:<app_id>)
    string inspect_app_id = 1;
    // Inspect token (must be sent in the x-deis-inspect-token header)
    string token = 2;
}

// ============ Configuration management ============

// Push configuration request
message PushConfigRequest {
    // Configuration version number
    int64 version = 1;

    // Configuration content (JSON format)
    string config_json = 2;

    // Configuration type
    ConfigType config_type = 3;

    // Whether to force the update
    bool force = 4;
}

// Configuration type
enum ConfigType {
    CONFIG_TYPE_UNSPECIFIED = 0;
    GLOBAL = 1;      // Global configuration
    APP = 2;         // Application configuration
    RESOURCE = 3;    // Resource configuration
}

// Push configuration response
message PushConfigResponse {
    bool success = 1;
    string message = 2;
    int64 applied_version = 3;
}

// ============ Application management ============

// Apply one deployment on this node.
//
// This carries a pointer, never a payload. The control plane decides which
// version an environment should run and says so here; the node downloads
// `bundle_url` itself, checks it against `bundle_sha`, and only then loads
// it. Pushing the zip through gRPC instead - which is what the removed
// DeployApp did - put a whole application inside one message and hit the
// tonic size ceiling as soon as an app carried real assets.
message ApplyDeploymentRequest {
    // Application this deployment belongs to. Together with `environment`
    // it identifies a running application on a node: the same app in
    // production and in a preview are two separate loads with their own
    // version, bindings and secrets, and they must never overwrite each
    // other. The storage tenant is built from the same pair, with
    // deis_wire::conventions::tenant_id.
    string app_id = 1;

    // Immutable version being deployed. Echoed back in the response so the
    // control plane can tell an applied version from a stale one.
    string version_id = 2;

    // Environment name, "production" or a preview name. Never an id: this
    // is the name the application code branches on, the other half of the
    // key a node stores this deployment under, and the second part of the
    // storage tenant id. Absent on the HTTP data path means "production"
    // (deis_wire::conventions::DEFAULT_ENVIRONMENT); here it is always set.
    string environment = 3;

    // Absolute HTTP URL the node downloads the bundle from, on the control
    // plane that sent this request.
    string bundle_url = 4;

    // Hex sha256 of the bundle. The node must verify the bytes it
    // downloaded against this before loading anything from them.
    string bundle_sha = 5;

    // Environment variables plus decrypted secret values, merged into one
    // dictionary and injected as `context.env`.
    //
    // Secret values exist in the clear only here, in flight, and in the
    // node's memory. They are never written to the bundle and never stored
    // decrypted, and they must never be logged - logging this message as a
    // whole would print every one of them.
    //
    // Two paths carry them, both of them to a node: this message, and the
    // answer to GET /api/nodes/{node_id}/assignments, which a node that
    // restarts uses to come back with the environment it had. Both must
    // therefore be authenticated. No other read API returns a value: the
    // dashboard and the CLI can write and delete a secret and list its
    // name, never read it back.
    map<string, string> env = 6;

    // What this version's bundle manifest asked to be held to. Absent means
    // it asked for nothing and takes the node's own ceilings.
    //
    // Narrowing only, on every field. The node clamps each value against its
    // own configuration and logs an application that tries to widen one, so
    // this can never buy an application more of a shared machine than the
    // operator allowed - see
    // crates/deis-runtime/src/app/manager.rs::effective_limits.
    //
    // Read by the control plane out of the manifest it stored with the
    // version, so a node never opens a bundle to find out what its ceilings
    // are, and the same values reach a restarting node through
    // GET /api/nodes/{node_id}/assignments.
    ResourceLimits limits = 7;

    // Which day's platform this version was written against, as its bundle
    // manifest declares it.
    //
    // Absent means the application declares nothing and is held to the oldest
    // behaviour this platform has - see
    // deis_bundle::compatibility::CompatibilityProfile::resolve for why that
    // is the safe direction and what it costs.
    //
    // The node checks this before it downloads anything: a node whose build is
    // older than the date named here cannot give the application the answers
    // it asked for, and refuses the deployment rather than serving it
    // different semantics in silence. The bundle's own manifest carries the
    // same declaration and is the authority once the bundle is unpacked; this
    // copy is what lets the refusal happen before a megabyte is fetched, and
    // what a restarting node reads out of
    // GET /api/nodes/{node_id}/assignments.
    CompatibilityDeclaration compatibility = 8;

    // Permanent application identity used to derive storage authority. This
    // is additive for rolling upgrades: both canonical fields are empty when
    // the producer predates canonical identity. A node must accept both empty
    // or validate both as lowercase UUIDv7; it must reject a one-sided or
    // malformed pair rather than guess and attach data to the wrong tenant.
    string canonical_application_id = 9;

    // Permanent environment identity. Together with
    // `canonical_application_id` it spells the logical tenant
    // `v1/<application UUIDv7>/<environment UUIDv7>`. The human environment
    // name in field 3 remains what application code sees and what rolling
    // upgrade routing uses; it is no longer the future storage authority.
    string canonical_environment_id = 10;

    // Exact Edge Canon declaration and version-bound binding snapshot. JSON is
    // RFC 8785 canonical UTF-8. Both are present together for schema-2 native
    // bundles and absent together only on legacy schema-1 deployments.
    string environment_declarations_json = 11;
    string environment_snapshot_json = 12;
    string environment_snapshot_id = 13;

    // Plaintext secret values keyed by the opaque revision ids named in the
    // snapshot. Names and config values remain in the canonical snapshot;
    // this map is the only secret-bearing addition and must never be logged.
    map<string, string> secret_values_by_revision = 14;
}

// A version's compatibility declaration, exactly as its manifest spells it.
//
// Not the resolved answers: the node resolves the date and the flags against
// its own copy of the behaviour table, so that a node and the control plane
// can be on different builds and each say what it can honour.
message CompatibilityDeclaration {
    // Calendar day as YYYY-MM-DD. Empty means the manifest names no date,
    // which the receiver reads as "the oldest behaviour".
    string date = 1;

    // Behaviours taken early or held back by name, from
    // deis_bundle::compatibility::FLAGS. A name the receiver does not know is
    // a refusal, never something to ignore.
    repeated string flags = 2;
}

// Apply deployment response
message ApplyDeploymentResponse {
    // False means the node is still running whatever it ran before.
    bool success = 1;

    // What happened, for the control plane's log and API answer. Must not
    // echo any value from the env map.
    string message = 2;

    // Version the node is running for this app and environment now. Equal
    // to the requested version_id on success; on failure it is whatever
    // the node kept running, which is what makes a rejected deployment
    // readable rather than merely failed.
    string version_id = 3;
}

// Application configuration
message AppConfig {
    // Environment variables
    map<string, string> env = 1;

    // Resource limits
    ResourceLimits limits = 2;

    // Routing rules
    repeated RouteRule routes = 3;
}

// Resource limits
message ResourceLimits {
    // Memory limit (MB)
    int32 memory_mb = 1;

    // CPU *share* in millicores. Carried since the first version of this
    // message and enforced by nothing: a share only means something to a
    // scheduler that hands out fractions of a core, and a node here pins one
    // isolate to one thread. What is actually enforced is cpu_time_limit_ms
    // below. Kept so older control planes keep parsing.
    int32 cpu_milli = 2;

    // Maximum concurrent requests
    int32 max_concurrency = 3;

    // Maximum number of ResourceTable entries
    int32 resource_table_max = 4;

    // Per-app override of the platform default execution timeout (ms).
    // 0 means "use the platform default".
    int64 timeout_ms = 5;

    // Per-app override of the platform default JS-op rate limit (ops/sec).
    // 0 means "use the platform default".
    double rate_limit_ops_per_sec = 6;

    // Per-app override of the platform default CPU-time ceiling (ms) for one
    // invocation. 0 means "use the platform default".
    //
    // Narrowing only: a value above the node's ceiling is refused and the
    // node's is applied. CPU time is the node's resource, not the
    // application's, so an app may give itself less of it but never more.
    int64 cpu_time_limit_ms = 7;
}

// Routing rule.
//
// The runtime uses these only to fill `context.params`; they do not select an
// app (deis-proxy does that) and they do not gate a request.
message RouteRule {
    // Route pattern, spelled exactly as the app bundle manifest spells it in
    // `routes[].pattern` (docs/implementation-plan.zh.md section 2).
    //
    // Exact segments plus `:name` placeholders, for example "/api/users/:id".
    // The edge-canon spec also defines a catch-all (a `[[catch]].ts` file maps
    // to "/api/*"), which the matcher in
    // crates/deis-runtime/src/runtime/route_match.rs does NOT yet implement:
    // such a pattern currently matches nothing, and the only symptom is an
    // empty `context.params`. Catch-all support is wave B work.
    string pattern = 1;

    // Methods this rule applies to. Empty means any method.
    //
    // Currently ignored by the runtime: a request reaches the app whatever its
    // method, and the app decides. Method-aware route selection is wave B work.
    repeated string methods = 2;
}

// Stop serving an application on this node.
//
// Sent when an application is deleted from the catalog. A node only ever
// *adds* what its assignment list names and never removes what has gone
// from it, so without this call a deleted application keeps running - still
// answering requests, still holding its decrypted secrets in memory, still
// polling its queues - until the node process restarts.
message UnloadAppRequest {
    string app_id = 1;

    // Which environment of that application to unload.
    //
    // Empty means every environment of it, which is what deleting the
    // application does: the catalog rows that would name them are already
    // gone by then, and a node may still hold an environment this control
    // plane forgot about earlier. A named environment leaves the app's
    // other environments running.
    string environment = 2;
}

// Unload app response
message UnloadAppResponse {
    // False means the node may still be serving the application. An app the
    // node was not running is not a failure: there is nothing left to
    // serve, which is the outcome the caller asked for.
    bool success = 1;
    string message = 2;

    // Environment names actually unloaded, for the control plane's report.
    // Empty on a node that was not running the app at all.
    repeated string environments = 3;
}

// Update app request
message UpdateAppRequest {
    string app_id = 1;
    // Field 2 was `bytes package_data`: a whole application archive carried
    // inside one gRPC message. That shape is gone from this platform - it is
    // what `DeployApp` was deleted for. A version is uploaded to the control
    // plane, which points a node at it (`ApplyDeployment`); the node fetches
    // the bundle over HTTP and verifies its digest, so no archive ever travels
    // in a message and a node never installs bytes it was handed.
    //
    // Keeping the field would have kept the shape available: a `bytes` field
    // on a request is an invitation, and the message ceiling
    // (`deis_wire::conventions::MAX_GRPC_MESSAGE_BYTES`) is the only thing
    // that would have said no.
    reserved 2;
    reserved "package_data";
    // Application config (optional; overrides the config in the manifest)
    AppConfig config = 3;
}

// Update app response
message UpdateAppResponse {
    bool success = 1;
    string message = 2;
}

// ============ Status queries ============

// Get status request
message GetStatusRequest {
    // Whether to include app details
    bool include_apps = 1;
}

// Get status response
message GetStatusResponse {
    // Basic worker info
    NodeInfo node_info = 1;

    // Application list
    repeated AppStatus apps = 2;

    // System resource usage
    ResourceUsage resource_usage = 3;

    // Per-app OpMetrics summary
    repeated AppOpMetrics op_metrics = 4;
}

// Per-app OpMetrics summary. One entry per (app_id, environment) the node
// runs: a preview's op counts are its own and are not added to production's.
message AppOpMetrics {
    string app_id = 1;
    OpMetricsSummary summary = 2;

    // Environment these counters belong to.
    string environment = 3;
}

// OpMetrics summary
message OpMetricsSummary {
    uint64 ops_dispatched_sync = 1;
    uint64 ops_dispatched_async = 2;
    uint64 ops_dispatched_fast = 3;
    uint64 ops_completed_async = 4;
}

// Worker info
message NodeInfo {
    string node_id = 1;
    string version = 2;
    int64 uptime_seconds = 3;
    string hostname = 4;
}

// Status of one application on this node.
//
// One entry per (app_id, environment): the node runs production and every
// preview of an app side by side, each with its own version and counters,
// so an entry naming only the app would collapse two different things into
// one line.
message AppStatus {
    string app_id = 1;
    AppState state = 2;
    int64 request_count = 3;
    int64 error_count = 4;
    string error_message = 5;

    // Environment name, "production" or a preview name.
    string environment = 6;
}

// Application state enum
enum AppState {
    APP_STATE_UNSPECIFIED = 0;
    LOADING = 1;
    RUNNING = 2;
    STOPPED = 3;
    ERROR = 4;
}

// Resource usage
message ResourceUsage {
    double cpu_percent = 1;
    int64 memory_bytes = 2;
    int64 goroutines = 3;
}

// ============ Command execution ============

// Execute command request
message ExecuteCommandRequest {
    string command = 1;
    repeated string args = 2;
    map<string, string> options = 3;
}

// Execute command response
message ExecuteCommandResponse {
    bool success = 1;
    string output = 2;
    string error = 3;
}

// ============ Health check ============

// Health check request
message HealthCheckRequest {}

// Health check response
message HealthCheckResponse {
    bool healthy = 1;
    string version = 2;
    map<string, string> details = 3;
}
