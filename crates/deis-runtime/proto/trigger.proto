syntax = "proto3";

package deis.trigger;

// Trigger Service (Invocation API)
service Trigger {
  // Trigger a Queue event
  rpc OnQueue(QueueEvent) returns (TriggerResponse);
  
  // Trigger a Scheduled event (Cron)
  rpc OnScheduled(ScheduledEvent) returns (TriggerResponse);
}

message QueueEvent {
  string app_id = 1;
  string queue_name = 2;
  repeated QueueMessage messages = 3;
}

message QueueMessage {
  string id = 1;
  string body = 2;
  int64 timestamp = 3;
  int32 attempts = 4;
}

message ScheduledEvent {
  string app_id = 1;
  int64 scheduled_time = 2;
  string cron = 3;

  // Which environment of that application the schedule belongs to.
  //
  // A node runs production and every preview of an app side by side, each
  // with its own version, variables and secrets, so the application id alone
  // does not name a handler. The control plane keys its schedules by
  // (app, environment) and sends both halves here; without this field a
  // preview's cron ran the production copy's handler, with production's
  // secrets, and neither side could tell.
  //
  // Empty means the default environment ("production"), which is what a
  // caller that predates this field means.
  string environment = 4;
}

message TriggerResponse {
  bool success = 1;
  repeated string failed_message_ids = 2;
  string error = 3;
}
