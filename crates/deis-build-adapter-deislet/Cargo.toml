[package]
name = "deis-build-adapter-deislet"
version = "0.1.0"
edition = "2021"
authors = ["kookyleo <kookyleo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/deislet/deislet"
homepage = "https://github.com/deislet/deislet"
description = "Deislet adapter for deis-build: entry module and application bundle"

[dependencies]
deis-build-core = { version = "0.1.0", path = "../deis-build-core" }
deis-bundle = { path = "../deis-bundle" }
deis-wire = { workspace = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.4"
sha2 = "0.10"
hex = "0.4"
zip = "0.6"
