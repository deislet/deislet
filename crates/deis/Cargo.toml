[package]
name = "deis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Deislet developer CLI: build, deploy, inspect and roll back applications"

[[bin]]
name = "deis"
path = "src/main.rs"

[dependencies]
deis-build = { path = "../deis-build" }
# The bundle format is read back here so a deploy can name the app and the
# digest it is about to upload; never re-parsed by hand.
deis-bundle = { path = "../deis-bundle" }
# Shared conventions: the default environment name and what an application or
# environment name is allowed to contain.
deis-wire = { workspace = true }
# `deis dev` drives the node it starts over the same mutually authenticated
# management plane a control plane uses, so it loads an identity and dials
# with it exactly as the control plane does.
deis-identity = { path = "../deis-identity" }
# ...and, having no authority to ask, issues that identity itself: a throwaway
# root and two leaves, for one run, on loopback. See `dev::pki` for what that
# is and is not.
rcgen = "0.14"

clap = { version = "4.4", features = ["derive", "cargo"] }
colored = "2.1"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
# Renders a KV value or a blob object in --json output without doubling a
# binary payload into a much larger array of per-byte JSON numbers.
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
notify = "6.1"
walkdir = "2.4"
url = "2.5"
zip = "0.6"

# Used by src/quiet.rs to keep `--json` output free of build progress.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
tempfile = "3"
# A real deis-queue for the dead letter commands to read: `deis queue
# dead-letters` and `deis queue replay` are the only callers of two RPCs that
# had none, and the failure that leaves - a client that compiles against the
# proto but talks past the running service - is only visible over a socket.
# The server, not a stub, for that reason.
deis-queue = { path = "../deis-queue" }
# A real deis-telemetry for the log and trace readers to authenticate against.
# `deis logs`, `deis tail` and `deis trace` derive a capability token over a
# subject and the collector recomputes it over its own; nothing but a query
# against the running service proves the two strings agree. Test-only - this
# CLI does not link the collector's server, its database or its HTTP stack.
deis-telemetry = { path = "../deis-telemetry" }
