[package]
name = "deis-provider-driver-cloudflare"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/deislet/deislet"
description = "Cloudflare Workers provider driver implementing edge-canon-provider-driver-v1"

[lib]
name = "deis_provider_driver_cloudflare"
path = "src/lib.rs"

[[bin]]
name = "deis-provider-driver-cloudflare"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
deis-build-core = { workspace = true }
deis-provider-driver = { workspace = true }
deis-wire = { workspace = true }
flate2 = "1.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = "0.2"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { workspace = true, features = ["process"] }
toml_edit = "0.22"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.8"

[dev-dependencies]
deis-build-adapter-cloudflare = { path = "../deis-build-adapter-cloudflare" }
tokio = { workspace = true, features = ["test-util"] }