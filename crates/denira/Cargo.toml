[package]
name = "denira"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# HTTP framework
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# TLS support
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.0"

# gRPC
tonic = { version = "0.12", features = ["router"] }
prost = "0.13"
tokio-stream = "0.1"

# Database
rusqlite = { version = "0.36", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Zero-copy config updates
arc-swap = "1.6"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.0"
structopt = "0.3"
hex = "0.4"
sha2 = "0.10"

# Embedded static files
rust-embed = "8"
mime_guess = "2"

reqwest = { version = "0.11", features = ["json"] }

# Denira WorkIt SDK
denira-workit = { path = "../denira-workit" }

[dev-dependencies]
tempfile = "3"
