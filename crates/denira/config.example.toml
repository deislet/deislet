# Denira Supervisor Configuration Example

# WebSocket server bind address
bind_addr = "0.0.0.0"

# WebSocket server port
port = 8080

# Heartbeat interval in seconds (how often workers should send heartbeats)
heartbeat_interval = 30

# Heartbeat timeout in seconds (after which a worker is considered disconnected)
heartbeat_timeout = 90

# Pre-shared keys for worker authentication
# Workers must provide one of these keys to authenticate
worker_preshared_keys = [
    "your-worker-secret-key-here",
    "another-worker-key-for-different-workers"
]

# ========================================
# API Authentication Configuration
# ========================================

# Enable API authentication (default: false)
# When enabled, all API endpoints (except /health) require a valid API key
api_auth_enabled = true

# API keys for HTTP API authentication
# Clients must provide one of these keys via:
#   - Authorization header: "Authorization: Bearer <api_key>"
#   - X-API-Key header: "X-API-Key: <api_key>"
api_keys = [
    "denira-admin-key-replace-this-in-production",
    "denira-readonly-key-for-monitoring-tools"
]

# Example usage:
#   curl -H "Authorization: Bearer denira-admin-key-replace-this-in-production" \
#        http://localhost:8081/api/workers
#
#   curl -H "X-API-Key: denira-admin-key-replace-this-in-production" \
#        http://localhost:8081/api/configs

# ========================================
# TLS/HTTPS Configuration
# ========================================
# Enable HTTPS for API server (optional but recommended for production)
#
# [tls]
# api_enabled = true
# ws_enabled = false  # WebSocket TLS is recommended via reverse proxy
# cert_path = "/path/to/fullchain.pem"  # TLS certificate (PEM format)
# key_path = "/path/to/privkey.pem"     # TLS private key (PEM format)
#
# To generate self-signed certificates for testing:
#   openssl req -x509 -newkey rsa:4096 -nodes \
#     -keyout key.pem -out cert.pem -days 365 \
#     -subj "/CN=localhost"
#
# For production, use Let's Encrypt:
#   certbot certonly --standalone -d your-domain.com
#   cert_path = "/etc/letsencrypt/live/your-domain.com/fullchain.pem"
#   key_path = "/etc/letsencrypt/live/your-domain.com/privkey.pem"

# ========================================
# Security Recommendations
# ========================================
# 1. Generate strong random keys (e.g., using: openssl rand -hex 32)
# 2. Never commit real keys to version control
# 3. Use environment variables for sensitive keys in production
# 4. Rotate keys periodically
# 5. Use different keys for different environments (dev/staging/prod)
# 6. ALWAYS use TLS (HTTPS) in production environments
# 7. For WebSocket TLS, use a reverse proxy (nginx/Caddy) with TLS termination
