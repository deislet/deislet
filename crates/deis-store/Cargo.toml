[package]
name = "deis-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Deislet storage services: KV, SQL database and blob objects"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# `hooks` gives `Connection::authorizer` and `limits` gives `Connection::set_limit`.
# Both are what keeps a tenant's SQL inside its own file; see `crate::database`.
rusqlite = { workspace = true, features = ["hooks", "limits"] }
deis-wire = { workspace = true }
deis-backend-migration = { path = "../deis-backend-migration" }
deis-capability = { path = "../deis-capability", features = ["jwks-fetch"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tonic = "0.12"
tonic-health = "0.12"
prost = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
uuid = { version = "1.12", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2.2"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
# `test-util` gives the tests a controllable clock, so the sweeper can be
# checked without any real waiting.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "=3.2.0"
