# deis-store configuration. Every key but [machine_identity] is optional, and
# the values below are the defaults. [machine_identity] is what the service is
# served with, so `deis-store serve` refuses to start without it; the offline
# `snapshot` and `restore` subcommands do not need it.

# gRPC endpoint: KvStore, Database and BlobStore, plus the standard
# grpc.health.v1 service.
#
# Loopback by default; every call is authenticated whatever the address, and
# the listener speaks TLS only (see [machine_identity] below).
listen = "127.0.0.1:8090"

# Every call must carry an Ed25519-signed capability in
# `Authorization: Bearer <token>`, minted by the control plane for the tenant
# it names; there is no anonymous or loopback mode. The keys those tokens are
# checked against are the control plane's public keys, read from its JWKS on
# the machine channel at startup (calls are refused until the first fetch
# lands), every five minutes after, and whenever a token names a key not yet
# fetched - so a key rotation on the control plane needs nothing done on this
# host.
#
# The machine identity this is read with is the [machine_identity] table at
# the end of this file.

# Directory holding kv.sqlite, blob.sqlite, db/<tenant>.sqlite and the blob
# content tree. Back this up: it is the only copy of every tenant's data.
#
# One SQLite file per tenant is the boundary between tenants, and it is held
# by SQLite's own authorizer rather than by the layout: an application's SQL
# cannot ATTACH another file, cannot VACUUM a copy of itself anywhere, and
# cannot run the pragmas that would disclose these paths. So the directory
# layout is not a secret, but the process still must not be able to write
# outside this tree for any other reason - run it as a user that cannot.
#
# A tenant is one application in one environment, spelled "<app>.<environment>"
# (for example "demo.production"). A directory written before that was true is
# keyed by bare application ids and cannot be read now; there is no migration,
# and the service refuses to start on one rather than serving empty stores
# over the top of it.
data_dir = "./data"

# How much a commit is allowed to cost in durability: "normal" or "full".
# The default is "normal", shown here because an empty file is the
# documented starting point.
#
# Every SQLite file here runs in WAL mode, so "normal" means a commit's WAL
# frame is not fsynced until a checkpoint: a host that loses power may lose
# the last seconds of writes it had already acknowledged (KV entries, blob
# metadata, a tenant's own SQL). The database cannot be corrupted by it - at
# recovery an incomplete WAL frame is discarded whole, never half-applied.
# "full" fsyncs on every commit and closes that window.
#
# The store defaults to "normal" because its writes are cheaper to re-derive
# than the queue's or the control plane's; the component-by-component
# reasoning is ADR-012's 各组件 SQLite 耐久性取舍 table. If a power loss
# leaves blob content whose metadata row was lost, the content file survives
# as an orphan; see the one-start remove_orphaned_blob_content switch below
# to clean those up.
durability = "normal"

# Whether the blob store's start-up sweep may delete content files no
# metadata row references. Off by default: such a file is usually the
# leftover of a crash between placing content and committing its row, but it
# is also exactly what every object written after a metadata snapshot looks
# like once that older snapshot is restored, and the sweep cannot tell the
# two apart. Off, the sweep counts them and logs the count at warn with
# this switch's name; turn it on for one start after confirming the
# metadata is the newest copy, and turn it off again.
# remove_orphaned_blob_content = false

# Connections in the pool of each shared SQLite file (KV and blob metadata),
# and with it the ceiling on blocking threads those two stores occupy.
# Raising it buys concurrency for readers; SQLite serialises writers whatever
# this says.
shared_connections = 8

# Connections in the pool of one tenant's database file. Kept small on
# purpose: with many tenants it is the sum across them that decides how many
# threads and file handles the process holds. Note that an application with a
# production environment and two previews is three tenants, so three files.
#
# Two is the minimum and anything lower is raised to it at startup, with a
# warning. An interactive transaction pins one connection for as long as it
# stays open, so a pool of one would leave that tenant's ordinary queries
# waiting for the transaction's deadline before they could run at all.
tenant_connections = 4

# Seconds between sweeps of expired KV entries. Expiry is already honoured by
# every read, so this only decides how long dead rows keep occupying disk, not
# whether an expired value can still be read (it cannot).
kv_sweep_interval_secs = 300

# Largest object BlobStore.Put will accept, in bytes (512 MiB). An upload that
# goes over is refused once it crosses the line and its temporary file is
# removed, so the caller pays for the transfer but the disk does not.
max_object_bytes = 536870912

# Seconds a blob upload may go without sending a body chunk before the store
# gives up on it. Set to 0 to wait forever - then one client that stops
# sending mid-object holds a task, a file descriptor and a full-size temporary
# file until the process restarts.
upload_idle_timeout_secs = 60

# Seconds a blob download may wait for the client to take the chunk the store
# is holding before the store abandons it. Set to 0 to wait forever - then one
# client that opens a Get and stops reading holds a task and an open content
# file until the process restarts. An abandoned download ends in a
# DeadlineExceeded status rather than a clean end, so a partial body is never
# mistaken for the whole object.
download_idle_timeout_secs = 60

# --- backups -----------------------------------------------------------

# Where the service writes its own snapshots, one subdirectory per snapshot.
#
# Commented out by default, and then nothing ever takes one: the data
# directory above is the only copy of every tenant's data, and it cannot be
# backed up by copying it while the service runs, because SQLite is in WAL
# mode and a plain copy can restore as a database missing its last commits or
# as a corrupt one. The service warns at startup while this is unset.
#
# Uncomment it and the service snapshots itself on the interval below, using
# exactly the same code as `deis-store snapshot --out DIR`. Leave it commented
# out if a backup agent, cron or a filesystem snapshot is doing the job
# instead - but check that one of them actually is.
#
# Put it on a different disk from data_dir, and copy it off this host. A
# snapshot that shares a disk with the thing it is a copy of survives an
# accidental `rm`, and nothing else.
# snapshot_dir = "/var/backups/deis-store"

# Seconds between scheduled snapshots. Only consulted when snapshot_dir is
# set. A snapshot that takes longer than this delays the next one rather than
# running two at once, so a value shorter than a snapshot takes does not pile
# copies up - it just means the service is always snapshotting.
#
# Set to 0 to suspend the schedule while keeping snapshot_dir configured.
snapshot_interval_secs = 86400

# How many snapshots to keep. After each successful snapshot, everything older
# than the newest this many is deleted; only directories written by the
# schedule and holding a finished manifest are ever considered, so an
# operator's own copies in the same directory are left alone.
#
# 0 means keep every snapshot and delete none. That is the safe reading of a
# value typed by accident: a full disk can be recovered from, and a retention
# rule that ate the backups cannot.
snapshot_retention = 7

# This store's machine identity: a certificate naming
# spiffe://<trust domain>/deislet/store/<id>, issued by the fleet's authority.
# The gRPC listener presents it to every caller, and callers refuse a server
# whose certificate does not chain to the fleet's trust root or names another
# kind of machine; the store proves it to the control plane when it reads the
# JWKS over mutual TLS. `control_endpoint` is the control plane's machine
# channel - http:// is refused unless it names a loopback address. Renewed
# files are picked up every `identity_reload_seconds` without a restart.
#
# [machine_identity]
# certificate = "/etc/deis/store.crt"
# private_key = "/etc/deis/store.key"
# trust_root = "/etc/deis/ca.crt"
# control_endpoint = "https://127.0.0.1:8101"
# identity_reload_seconds = 60
