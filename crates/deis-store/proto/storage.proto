syntax = "proto3";

package deis.storage;

// KV Store Service
// Provides simple key-value storage
service KvStore {
  // Get a value
  rpc Get(GetRequest) returns (GetResponse);

  // Set a value
  rpc Set(SetRequest) returns (SetResponse);

  // Delete a key
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // List keys matching a prefix
  rpc List(ListRequest) returns (ListResponse);

  // Check whether a key exists
  rpc Has(HasRequest) returns (HasResponse);
}

// Get request
message GetRequest {
  string key = 1;
}

// Get response
message GetResponse {
  // If found, value is present; otherwise it is absent.
  //
  // Bytes, not a string: a KV value is whatever the application wrote -- a
  // PNG, a protobuf, a gzip frame -- and typing it as a string made every
  // value that is not valid UTF-8 unreadable through this API even though
  // the column behind it is a BLOB and held the bytes intact.
  optional bytes value = 1;
  // Whatever the last Set stored in `SetRequest.metadata`, returned
  // untouched. Absent when the key has none, and absent when the key does
  // not exist at all - `value` is what says which of the two happened.
  optional string metadata = 2;
  // Absolute unix second at which this entry lapses; absent means it never
  // does. Reported because the caller asked for a *lifetime* and cannot
  // otherwise tell how much of it is left; the store still enforces expiry
  // on every read, so a key returned here is live at the moment of the read.
  optional int64 expires_at = 3;
}

// Set request
message SetRequest {
  string key = 1;
  // Bytes, not a string; see GetResponse.value.
  bytes value = 2;
  // Lifetime in seconds from the moment the store accepts the write. Absent
  // means the entry never lapses. Must be positive: a zero or negative
  // lifetime is a caller bug, not a request to store something already
  // expired, so it is refused rather than honoured.
  optional int64 ttl_seconds = 3;
  // Opaque caller-defined string kept alongside the value. The store never
  // parses it; it is stored and returned untouched.
  optional string metadata = 4;
}

// Set response
message SetResponse {
  bool success = 1;
}

// Delete request
message DeleteRequest {
  string key = 1;
}

// Delete response
message DeleteResponse {
  bool success = 1;
}

// List request
message ListRequest {
  string prefix = 1;
  // Optional pagination parameters
  optional int32 limit = 2;
  optional string cursor = 3;
  // Ask for each key's metadata and expiry alongside its name.
  //
  // Absent or false gives the plain listing: `keys` is filled and `entries`
  // is empty, exactly as before this field existed. True swaps them: the
  // page arrives in `entries` and `keys` is left empty. The two are never
  // both filled, because a page may hold thousands of keys and sending each
  // name twice would double a response that is already the largest thing
  // this service sends.
  optional bool include_metadata = 4;
}

// One listed key with what the store knows about it.
message KvEntry {
  string key = 1;
  // As stored by SetRequest.metadata; absent when the key has none.
  optional string metadata = 2;
  // Absolute unix second at which the entry lapses; absent means never.
  optional int64 expires_at = 3;
}

// List response
message ListResponse {
  // Filled when the request did not ask for metadata; empty when it did.
  repeated string keys = 1;
  // Cursor for the next page (if any)
  optional string next_cursor = 2;
  // Filled when the request asked for metadata; empty when it did not. Same
  // order and same page as `keys` would have carried.
  repeated KvEntry entries = 3;
}

// Has request
message HasRequest {
  string key = 1;
}

// Has response
message HasResponse {
  bool exists = 1;
}

// Database Service
// Provides SQL database functionality similar to Cloudflare D1
service Database {
  // Execute a SQL statement (INSERT, UPDATE, DELETE, etc.)
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // Run a SQL query (SELECT)
  rpc Query(QueryRequest) returns (QueryResponse);

  // Execute multiple SQL statements in a batch
  rpc Batch(BatchRequest) returns (BatchResponse);

  // Prepare a statement
  rpc Prepare(PrepareRequest) returns (PrepareResponse);

  // Execute a prepared statement
  rpc ExecutePrepared(ExecutePreparedRequest) returns (ExecuteResponse);

  // Query with a prepared statement
  rpc QueryPrepared(QueryPreparedRequest) returns (QueryResponse);

  // Open an interactive transaction and get a handle to it.
  //
  // Unlike Batch, the caller decides what to do next from what it read: the
  // transaction stays open across calls on one pinned connection, so a
  // handler can read a row, branch on it, and write. The price is that the
  // connection is unavailable to anything else until the transaction ends,
  // which is why the server puts a deadline on it and bounds how many may
  // be open at once.
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);

  // Run a row-less statement inside an open transaction.
  rpc ExecuteInTransaction(ExecuteInTransactionRequest) returns (ExecuteResponse);

  // Run a query inside an open transaction, seeing its own uncommitted
  // writes.
  rpc QueryInTransaction(QueryInTransactionRequest) returns (QueryResponse);

  // Apply everything the transaction did and release the connection.
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);

  // Discard everything the transaction did and release the connection.
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);
}

// Execute request
message ExecuteRequest {
  string sql = 1;
  // JSON-encoded parameter array
  optional string params = 2;
}

// Execute response
message ExecuteResponse {
  bool success = 1;
  // Number of affected rows
  int64 rows_affected = 2;
  // Last inserted row ID
  optional int64 last_insert_id = 3;
  // Error message (if any)
  optional string error = 4;
}

// Query request
message QueryRequest {
  string sql = 1;
  // JSON-encoded parameter array
  optional string params = 2;
}

// Query response
message QueryResponse {
  bool success = 1;
  // JSON-encoded array of result rows
  string rows = 2;
  // Column names
  repeated string columns = 3;
  // Error message (if any)
  optional string error = 4;
}

// Batch request
message BatchRequest {
  repeated ExecuteRequest statements = 1;
}

// Batch response
message BatchResponse {
  bool success = 1;
  repeated ExecuteResponse results = 2;
  optional string error = 3;
}

// Prepare request
message PrepareRequest {
  string sql = 1;
}

// Prepare response
message PrepareResponse {
  bool success = 1;
  // Prepared statement ID
  string statement_id = 2;
  optional string error = 3;
}

// ExecutePrepared request
message ExecutePreparedRequest {
  string statement_id = 1;
  // JSON-encoded parameter array
  optional string params = 2;
}

// QueryPrepared request
message QueryPreparedRequest {
  string statement_id = 1;
  // JSON-encoded parameter array
  optional string params = 2;
}

// BeginTransaction request
message BeginTransactionRequest {
  // How long the caller wants the transaction to stay open, in
  // milliseconds. Absent asks for the server's ceiling; anything above the
  // ceiling is clamped down to it, and the value actually granted comes back
  // in `expires_in_ms`. Zero or negative is refused, because a transaction
  // that is dead on arrival is a caller bug rather than a request for one.
  optional int64 timeout_ms = 1;
}

// BeginTransaction response
message BeginTransactionResponse {
  bool success = 1;
  // Handle to pass to every later call. Belongs to the tenant that opened
  // it, which is checked on each use.
  string transaction_id = 2;
  // Milliseconds from the moment this response was produced until the server
  // rolls the transaction back on its own. It is a hard deadline, not a hint:
  // a handler that awaits something slow in the middle of a transaction will
  // find the handle dead, because the alternative is one handler holding its
  // tenant's only writer indefinitely.
  int64 expires_in_ms = 3;
  // Why no transaction was opened - most often that this tenant, or this
  // server, already has as many open as it allows.
  optional string error = 4;
}

// ExecuteInTransaction request
message ExecuteInTransactionRequest {
  string transaction_id = 1;
  string sql = 2;
  // JSON-encoded parameter array
  optional string params = 3;
}

// QueryInTransaction request
message QueryInTransactionRequest {
  string transaction_id = 1;
  string sql = 2;
  // JSON-encoded parameter array
  optional string params = 3;
}

// CommitTransaction request
message CommitTransactionRequest {
  string transaction_id = 1;
}

// CommitTransaction response
message CommitTransactionResponse {
  bool success = 1;
  // Set when the commit did not happen. The transaction is over either way:
  // the connection is released and the handle is spent, so a failed commit
  // means the work was rolled back rather than left open to retry.
  optional string error = 2;
}

// RollbackTransaction request
message RollbackTransactionRequest {
  string transaction_id = 1;
}

// RollbackTransaction response
message RollbackTransactionResponse {
  bool success = 1;
  optional string error = 2;
}
