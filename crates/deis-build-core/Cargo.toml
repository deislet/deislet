[package]
name = "deis-build-core"
version = "0.1.0"
edition = "2021"
authors = ["kookyleo <kookyleo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/deislet/deis-build"
homepage = "https://github.com/deislet/deis-build"
description = "Core types and traits for deis-build - Universal Edge Function Compiler"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
rolldown = { path = "/ext/deislet/resource/rolldown/crates/rolldown", features = ["experimental"] }
rolldown_common = { path = "/ext/deislet/resource/rolldown/crates/rolldown_common" }
