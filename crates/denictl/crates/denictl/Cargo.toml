[package]
name = "denictl"
version = "0.1.0"
edition = "2021"
authors = ["Deislet Team"]
license = "MIT"
repository = "https://github.com/deislet/denictl"

[[bin]]
name = "denictl"
path = "src/main.rs"

[dependencies]
denictl-core = { path = "../denictl-core" }
denictl-parser = { path = "../denictl-parser" }
denictl-compiler = { path = "../denictl-compiler" }
denictl-adapters = { path = "../denictl-adapters" }

clap = { version = "4.4", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"
dialoguer = "0.11"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
hyper = "1.0"
notify = "6.1"
walkdir = "2.4"
url = "2.5"
