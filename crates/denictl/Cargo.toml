[workspace]
members = [
    "crates/denictl",
    "crates/denictl-core",
    "crates/denictl-parser",
    "crates/denictl-compiler",
    "crates/denictl-adapters",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Deislet Team"]
license = "MIT"
repository = "https://github.com/deislet/denictl"

[workspace.dependencies]
# CLI dependencies
clap = { version = "4.4", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"
dialoguer = "0.11"
anyhow = "1.0"
thiserror = "1.0"

# Parser and compiler
swc_core = "0.90"
swc_common = "0.33"
swc_ecma_ast = "0.110"
swc_ecma_parser = "0.141"
swc_ecma_visit = "0.96"

# Serialization
serde = { version = "=1.0.188", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# File system and path
walkdir = "2.4"
glob = "0.3"

# Template engine
handlebars = "5.1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
