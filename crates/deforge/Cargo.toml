[package]
name = "deforge"
version = "0.1.0"
edition = "2021"
authors = ["kookyleo <kookyleo@gmail.com>"]
license = "Apache-2.0"
description = "Universal Edge Function Compiler - Transform standard code to platform-specific deployables"
repository = "https://github.com/deislet/deforge"
homepage = "https://github.com/deislet/deforge"
keywords = ["edge", "serverless", "compiler", "cloudflare", "deno"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[[bin]]
name = "deforge"
path = "src/main.rs"

[workspace]
members = [
    "crates/deforge-core",
    "crates/deforge-adapter-cf",
    "crates/deforge-adapter-dc",
    "crates/deforge-adapter-eo",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["kookyleo <kookyleo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/deislet/deforge"
homepage = "https://github.com/deislet/deforge"

[dependencies]
deforge-core = { version = "0.1.0", path = "crates/deforge-core" }
deforge-adapter-cf = { version = "0.1.0", path = "crates/deforge-adapter-cf" }
deforge-adapter-dc = { version = "0.1.0", path = "crates/deforge-adapter-dc" }
deforge-adapter-eo = { version = "0.1.0", path = "crates/deforge-adapter-eo" }

clap.workspace = true
colored.workspace = true
indicatif.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

# SWC dependencies (for parser module)
swc_core.workspace = true
swc_common.workspace = true
swc_ecma_ast.workspace = true
swc_ecma_parser.workspace = true
swc_ecma_visit.workspace = true

[workspace.dependencies]
# CLI dependencies
clap = { version = "4.4", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"
anyhow = "1.0"
thiserror = "1.0"

# Parser and compiler
swc_core = "0.100"
swc_common = "18.0"
swc_ecma_ast = "20.0"
swc_ecma_parser = "33.0"
swc_ecma_visit = "20.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# File system and path
walkdir = "2.4"
glob = "0.3"

# Template engine (for code generation)
handlebars = "5.1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
chrono = "0.4"

# Bundler
rolldown = { path = "/ext/deislet/resource/rolldown/crates/rolldown", features = ["experimental"] }
rolldown_common = { path = "/ext/deislet/resource/rolldown/crates/rolldown_common" }
rolldown_plugin = { path = "/ext/deislet/resource/rolldown/crates/rolldown_plugin" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
