[package]
name = "deforge-adapter-cf"
version = "0.1.0"
edition = "2021"
authors = ["kookyleo <kookyleo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/deislet/deforge"
homepage = "https://github.com/deislet/deforge"
description = "Cloudflare Workers adapter for deforge"

[dependencies]
deforge-core = { version = "0.1.0", path = "../deforge-core" }

handlebars = "5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.4"
