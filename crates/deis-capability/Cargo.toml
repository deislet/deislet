[package]
name = "deis-capability"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]
description = "Ed25519-signed JWT capabilities for Deislet service-to-service authorization"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.2.0"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = "2.2"
uuid = { version = "1.17.0", features = ["v7"] }
thiserror = "2"
deis-wire = { path = "../deis-wire" }
# The one parser of this fleet's SPIFFE names: T8 grace is for nodes only,
# and "is this a node" must be answered the way every handshake answers it.
deis-identity = { path = "../deis-identity" }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { version = "2", optional = true }

[features]
# Background refresh of a verifier's key ring from the control plane's JWKS,
# read over the machine channel under mutual TLS (see `control`).
jwks-fetch = ["dep:reqwest", "dep:tokio", "dep:tracing", "dep:url"]

[dev-dependencies]
tokio = { workspace = true }
