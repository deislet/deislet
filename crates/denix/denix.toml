# Denix 配置文件
# 自治型 JavaScript 运行时平台

# HTTP 服务端口（同时用于 HTTP 流量和 gRPC 管理接口）
http_port = 8000

# 数据目录（存储配置、日志缓冲等）
# 可通过环境变量 DENIX_DATA_DIR 覆盖
# data_dir = "./data"

# 日志配置（可选）
[logging]
# 是否启用日志推送
enabled = false

# 日志服务端点（未来实现）
# endpoint = "http://log-service:9000"

# 缓冲区大小
buffer_size = 10000

# 推送间隔（秒）
flush_interval = 5

# 每批次最大日志数
batch_size = 100

# 最大重试次数
max_retries = 3
