[package]
name = "denix"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[dependencies]
# Async runtime
tokio = { version = "1.48", features = ["full"] }

# HTTP framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Deno Runtime
deno_runtime = { git = "https://github.com/kookyleo/deno", branch = "bump-fqdn-0-5" }

# Deno Core (for op2 macro compatibility)
deno_core = "0.380"

# Compatibility pin: temporal_rs 0.1.2 (pulled in transitively via v8 -> temporal_capi)
# was written against icu_calendar 2.1.x; 2.2.x made breaking changes to the cal/types
# modules that break the temporal_rs build. Keep icu_calendar on 2.1.x.
icu_calendar = "~2.1"

# System Traits (for permissions)
sys_traits = "0.1.22"

# Serialization

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Time
chrono = "0.4"

# Concurrent data structures
dashmap = "5.5"

# High-performance cache
moka = { version = "0.12", features = ["future"] }

# Configuration storage
rusqlite = { workspace = true }
arc-swap = "1.7"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
once_cell = "1.21"
num_cpus = "1.17"
uuid = { version = "1.12", features = ["v4"] }

# gRPC and Protocol Buffers
tonic = "0.12"
prost = "0.13"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# WebSocket client
tokio-tungstenite = { version = "0.21", features = ["__rustls-tls"] }
futures-util = "0.3"

# Base64 encoding
base64 = "0.22"


# System information
hostname = "0.4"

# Cryptography and hashing
sha2 = "0.10"

# ZIP archive handling
zip = "0.6"
parking_lot = "0.12.5"
deno_ast = { version = "0.52.0", features = ["transpiling"] }
deno_error = "0.7.1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# Test dependencies
hyper = "1.7"
tower = "0.5"
tempfile = "3"
http-body-util = "0.1"

[lib]
name = "denix"
path = "src/lib.rs"
