[package]
name = "denix"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[dependencies]
# 异步运行时
tokio = { version = "1.48", features = ["full"] }

# HTTP 框架
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Deno Runtime
deno_runtime = { git = "https://github.com/kookyleo/deno", branch = "bump-fqdn-0-5" }

# Deno Core (for op2 macro compatibility)
deno_core = "0.380"

# 兼容性钉版本:temporal_rs 0.1.2 (经 v8→temporal_capi 间接引入) 是针对
# icu_calendar 2.1.x 编写的;2.2.x 对 cal/types 模块做了破坏性改动,会导致
# temporal_rs 编译失败。这里约束 icu_calendar 停留在 2.1.x。
icu_calendar = "~2.1"

# System Traits (for permissions)
sys_traits = "0.1.22"

# 序列化

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# 时间
chrono = "0.4"

# 并发数据结构
dashmap = "5.5"

# 高性能缓存
moka = { version = "0.12", features = ["future"] }

# 配置存储
rusqlite = { workspace = true }
arc-swap = "1.7"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 工具
once_cell = "1.21"
num_cpus = "1.17"
uuid = { version = "1.12", features = ["v4"] }

# gRPC 和 Protocol Buffers
tonic = "0.12"
prost = "0.13"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json"] }

# WebSocket 客户端
tokio-tungstenite = { version = "0.21", features = ["__rustls-tls"] }
futures-util = "0.3"

# Base64 编码
base64 = "0.22"


# 系统信息
hostname = "0.4"

# 加密和哈希
sha2 = "0.10"

# ZIP 压缩包处理
zip = "0.6"
parking_lot = "0.12.5"
deno_ast = { version = "0.52.0", features = ["transpiling"] }
deno_error = "0.7.1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# 测试依赖
hyper = "1.7"
tower = "0.5"
tempfile = "3"
http-body-util = "0.1"

[lib]
name = "denix"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
