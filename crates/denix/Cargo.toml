[package]
name = "denix"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[dependencies]
# 异步运行时
tokio = { version = "1.48", features = ["full"] }

# HTTP 框架
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# V8 引擎集成及标准库
deno_core = "0.367"

# 序列化

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# 时间
chrono = "0.4"

# 并发数据结构
dashmap = "5.5"

# 高性能缓存
moka = { version = "0.12", features = ["future"] }

# 配置存储
rusqlite = { version = "0.36", features = ["bundled"] }
arc-swap = "1.7"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 工具
once_cell = "1.21"
num_cpus = "1.17"

# gRPC 和 Protocol Buffers
tonic = "0.12"
prost = "0.13"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json"] }

# WebSocket 客户端
tokio-tungstenite = { version = "0.21", features = ["__rustls-tls"] }
futures-util = "0.3"

# Base64 编码
base64 = "0.22"

# 正则表达式 (用于 ESM 转换)
regex = "1.11"

# 系统信息
hostname = "0.4"

# 加密和哈希
sha2 = "0.10"

# ZIP 压缩包处理
zip = "0.6"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# 测试依赖
hyper = "1.7"
tower = "0.5"
tempfile = "3"
http-body-util = "0.1"

[lib]
name = "denix"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
