[package]
name = "workit"
version = "0.1.0"
edition = "2024"
description = "Worker communication toolkit for Denira supervisor integration"

[dependencies]
async-trait = "0.1.83"
chrono = { version = "0.4.41", features = ["serde"] }
futures-util = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
pwrzv = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.45.1", features = ["full"] }
tokio-tungstenite = { version = "0.24.0", features = ["native-tls"] }
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
yasm = { version = "0.4.0", features = ["serde"] }

[dev-dependencies]
tracing-subscriber = "0.3.18"

[[example]]
name = "extensible_messages"
path = "examples/extensible_messages.rs"

