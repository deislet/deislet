[package]
name = "deis-provider-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/deislet/deislet"
description = "Provider-neutral deployment driver contract and secure official-tool boundary"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
deis-artifact = { path = "../deis-artifact" }
deis-wire = { workspace = true }
ed25519-dalek = "2.2"
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = "0.2"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { workspace = true }
tracing = "0.1"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
