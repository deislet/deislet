[package]
name = "deis-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/deislet/deislet"
description = "Machine identity for the deislet control channel: SPIFFE-named certificates over mutual TLS"

[dependencies]
arc-swap = "1.9"
# Derives the key a machine seals its own files at rest with, from its
# private key, so that key never has to be stored anywhere.
hkdf = "0.12"
rustls = "0.23"
rustls-pemfile = "2.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { workspace = true }
tracing.workspace = true
# The one thing rustls cannot do for us: read the URI SAN back out of a
# certificate it has just verified. webpki parses subject alternative names
# but keeps `GeneralName` crate-private, so the name a peer is known by has to
# be parsed here.
#
# The deno fork also brings x509-parser 0.15 through deno_net and
# deno_node_crypto, so this is a second copy in the tree. That is deliberate:
# pinning the parser that reads machine identities to whichever version a
# vendored fork happens to carry is the wrong dependency to accept, and the
# cost of the duplicate is compile time in a crate the runtime does not link.
x509-parser = "0.18"
# The three the dialler needs, and no RPC framework: what it produces is a
# TLS stream that any hyper-based client can be handed, so nothing here has
# to know that the thing on top of it is gRPC.
# The URI type a connector is asked to dial, and nothing else from it.
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = "0.26"
tower-service = "0.3"

[dev-dependencies]
# The certificate authority these tests mint from. It is a crate of its own
# rather than a feature of this one so that no workspace build can unify it
# into a shipping process - see that crate's own module documentation.
deis-identity-test-pki = { path = "../deis-identity-test-pki" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# The tests handshake over a real socket rather than asserting on a parser:
# what has to hold is that a listener built here refuses a connection, and
# refusing it is something only the TLS stack can do.
tokio-rustls = "0.26"
