[package]
name = "deis-build"
version = "0.1.0"
edition = "2021"
authors = ["kookyleo <kookyleo@gmail.com>"]
license = "Apache-2.0"
description = "Universal Edge Function Compiler - Transform standard code to platform-specific deployables"
repository = "https://github.com/deislet/deislet"
homepage = "https://github.com/deislet/deislet"
keywords = ["edge", "serverless", "compiler", "cloudflare", "deno"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
readme = "README.md"
documentation = "https://docs.rs/deis-build"

[lib]
name = "deis_build"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "deis-build"
path = "src/main.rs"

[dependencies]
deis-build-core = { version = "0.1.0", path = "../deis-build-core" }
deis-build-adapter-cloudflare = { version = "0.1.0", path = "../deis-build-adapter-cloudflare" }
deis-build-adapter-deno = { version = "0.1.0", path = "../deis-build-adapter-deno" }
deis-build-adapter-tencent = { version = "0.1.0", path = "../deis-build-adapter-tencent" }
deis-build-adapter-deislet = { version = "0.1.0", path = "../deis-build-adapter-deislet" }
deis-bundle = { path = "../deis-bundle" }

clap = { version = "4.4", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.4"
pathdiff = "0.2"
unicode-normalization = "0.1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# SWC dependencies (for parser module)
swc_core = "0.100"
swc_common = "18.0"
swc_ecma_ast = "20.0"
swc_ecma_parser = "34.0"
swc_ecma_transforms_base = "37.0"
swc_ecma_visit = "20.0"

[dev-dependencies]
deis-runtime = { path = "../deis-runtime" }
tempfile = "3"
zip = "0.6"
