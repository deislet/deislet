[package]
name = "deis-queue"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Deislet message queue with lease-based consumption"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
deis-wire = { workspace = true }
deis-backend-migration = { path = "../deis-backend-migration" }
deis-capability = { path = "../deis-capability" }
tonic = "0.12"
tonic-health = "0.12"
prost = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
uuid = { version = "1.12", features = ["v4"] }
tokio-stream = "0.1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2.2"

[dev-dependencies]
tempfile = "3"
# The durability benchmark measures the open path's pragma settings with a
# direct connection rather than the pool; `rusqlite` is already a dependency,
# but integration tests only link `dev-dependencies`.
rusqlite = { workspace = true }
# `test-util` gives the tests a controllable clock, so the dead letter sweep
# can be checked without any real waiting.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "=3.2.0"
