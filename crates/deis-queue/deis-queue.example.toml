# deis-queue configuration. Every key but [machine_identity] is optional, and
# the values below are the defaults. [machine_identity] is what the service is
# served with, so `deis-queue serve` refuses to start without it; the offline
# `snapshot` and `restore` subcommands do not need it.

# Address the gRPC server binds to.
#
# Loopback by default; every call is authenticated whatever the address, and
# the listener speaks TLS only (see [machine_identity] at the end).
listen = "127.0.0.1:8091"

# Every call must carry an Ed25519-signed capability in
# `Authorization: Bearer <token>`, minted by the control plane for the tenant
# it names; there is no anonymous or loopback mode. The keys those tokens are
# checked against are the control plane's public keys, read from its JWKS on
# the machine channel named in [machine_identity] at startup (calls are
# refused until the first fetch lands), every five minutes after, and whenever
# a token names a key not yet fetched - so a key rotation on the control plane
# needs nothing done on this host.

# Directory holding queue.sqlite.
#
# A tenant is one application in one environment, keyed by canonical ids
# ("v1/<application id>/<environment id>") and named by the capability on each
# call, never by the caller.
data_dir = "./data"

# Connections in the SQLite pool, and the ceiling on blocking threads this
# service occupies.
connections = 8

# Largest single message body, in bytes. A queue message is a job description,
# not a payload: anything large belongs in blob storage, with only its key
# sent through the queue. 128 KB is the shared standard's ceiling, the largest
# message every host accepts.
max_body_bytes = 131072

# Most messages one SendBatch may carry. The batch is one transaction, so this
# also bounds how long a producer can hold the write lock.
max_batch_messages = 100

# Lease used when a Pull does not ask for one, in seconds. Pick a lease longer
# than the handler's worst-case run time: a lease that lapses while the handler
# is still working causes a second delivery of a message already being handled.
default_lease_secs = 30

# Ceiling on a requested lease, and on a Nack redelivery delay. Both say how
# long a message stays invisible.
max_lease_secs = 3600

# Messages returned when a Pull does not ask for a count, and the ceiling on
# what it may ask for. The pull ceiling is also the most ids one Ack or Nack
# may name.
default_pull_messages = 10
max_pull_messages = 100

# How many times a message may be delivered before it is dead lettered instead
# of retried. Delivery is at-least-once, so a handler must be idempotent; this
# is what stops a message that always fails from being retried forever. 3 is
# the shared standard's count, also the number a queue consumer's declaration
# carries by default.
max_attempts = 3

# How long a dead lettered message is kept, in seconds. Zero keeps it forever,
# which is the default: dead letters exist to be looked at, and deleting them
# on a timer would quietly destroy the evidence of why a queue failed. The cost
# is that the table grows until this retention is turned on.
#
# Reading them does not need this file: ListDeadLetters pages through them and
# ReplayDeadLetters puts named ones back on their queue with a fresh set of
# delivery attempts, for after the cause has been fixed.
dead_letter_retention_secs = 0

# How often expired dead letters are deleted. Only consulted when
# dead_letter_retention_secs is non-zero.
dead_letter_sweep_interval_secs = 3600

# Ceiling on how long the server spends on one request before answering with an
# error, in seconds. Every call is a bounded query against a local SQLite file,
# so anything approaching this is a wedged writer; without the ceiling such a
# call would hold a connection pool permit until the process was restarted.
# Zero disables it, and the service warns at startup when you do.
request_timeout_secs = 30

# This queue's machine identity: a certificate naming
# spiffe://<trust domain>/deislet/queue/<id>, issued by the fleet's authority.
# The gRPC listener presents it to every caller, and callers refuse a server
# whose certificate does not chain to the fleet's trust root or names another
# kind of machine; the queue proves it to the control plane when it reads the
# JWKS over mutual TLS. `control_endpoint` is the control plane's machine
# channel - http:// is refused unless it names a loopback address. Renewed
# files are picked up every `identity_reload_seconds` without a restart.
#
# [machine_identity]
# certificate = "/etc/deis/queue.crt"
# private_key = "/etc/deis/queue.key"
# trust_root = "/etc/deis/ca.crt"
# control_endpoint = "https://127.0.0.1:8101"
# identity_reload_seconds = 60
