[package]
name = "deis-backend-topology"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Crash-recoverable embedded backend snapshot and restore topology driver"

[dependencies]
anyhow = { workspace = true }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
deis-queue = { path = "../deis-queue" }
deis-store = { path = "../deis-store" }
deis-telemetry = { path = "../deis-telemetry" }
deis-wire = { workspace = true }
fs2 = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
