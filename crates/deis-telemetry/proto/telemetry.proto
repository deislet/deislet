syntax = "proto3";

package deis.telemetry;

// Log ingest, query and live follow.
//
// This service is deliberately "dumb": it stores and returns what it was
// given. It never evaluates health, never raises alerts and never calls back
// into any other component. Liveness of a component is judged by a direct
// health check against that component, never through this service.
//
// Liveness of this service itself is answered by the standard
// grpc.health.v1.Health service, which every Deislet component registers.
// There is deliberately no health RPC here: two health surfaces that can
// disagree are worse than one.
service LogService {
    // Push logs (batched)
    rpc PushLogs(PushLogsRequest) returns (PushLogsResponse);

    // Query stored logs, newest first, paginated
    rpc Query(QueryRequest) returns (QueryResponse);

    // Follow logs as they arrive (backs "deis tail")
    rpc Tail(TailRequest) returns (stream LogEntry);
}

// Per-invocation traces: ingest, query and live follow.
//
// A log line says something happened. A trace record says one *invocation*
// happened: which application, which kind of invocation, what it was aimed
// at, how long it took, and how the platform decided it ended. That last part
// is the reason this service exists next to LogService - an application that
// fails silently writes no log line at all, and the difference between "the
// application threw" and "we cut it off" is knowable only to the runtime.
//
// Traces carry the same `trace_id` the application's log lines carry, so
// LogService.Query with that trace_id returns the lines one invocation wrote.
//
// Just as dumb as the other two: records are stored and handed back, never
// judged, thresholded or alerted on.
service TraceService {
    // Push trace records (batched)
    rpc PushTraces(PushTracesRequest) returns (PushTracesResponse);

    // Query stored traces, newest first, paginated
    rpc QueryTraces(QueryTracesRequest) returns (QueryTracesResponse);

    // Follow traces as they arrive
    rpc TailTraces(TailTracesRequest) returns (stream TraceRecord);
}

// Metric ingest and query.
//
// Split from LogService because the two carry different data with different
// retention and different consumers: a component that only ships metrics has
// no reason to hold a client for the log surface. Stored samples are also
// exported in Prometheus text format on this service's HTTP scrape port.
//
// Just as dumb as LogService: samples are stored and handed back, never
// judged, thresholded or alerted on.
service MetricService {
    // Push numeric metric samples (batched)
    rpc PushMetrics(PushMetricsRequest) returns (PushMetricsResponse);

    // Query stored metric samples, newest first, paginated
    rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
}

// Log level
enum LogLevel {
    LOG_LEVEL_UNSPECIFIED = 0;
    TRACE = 1;
    DEBUG = 2;
    INFO = 3;
    WARN = 4;
    ERROR = 5;
    FATAL = 6;
}

// A single log record
message LogEntry {
    // Timestamp (microseconds since the Unix epoch). 0 is stamped with the
    // server receive time. Anything negative or more than an hour ahead of
    // the server clock is refused, and so is anything older than the log
    // retention window (the next sweep would delete it, and getting it there
    // would first create a day partition inside the one write transaction);
    // the refusal names the stamp and the window in
    // PushLogsResponse.error_message, which is how a node with a wrong clock
    // gets found.
    int64 timestamp_us = 1;

    // Log level
    LogLevel level = 2;

    // Component that produced the entry, e.g. "deis-runtime", "deis-proxy".
    // Not an application and not a node: the application dimension is app_id
    // below, and this service does not know about nodes at all.
    string component = 3;

    // Application ID (optional). The application, not the storage tenant: a
    // node that runs several environments of one application sends them all
    // under this one id and puts the environment in `fields`, so a query for
    // an application answers with every environment of it.
    string app_id = 4;

    // Log message
    string message = 5;

    // Structured fields. Keys over 256 bytes refuse the entry; values are
    // cut at 16 KiB and marked, like an oversized message; more than 64 KiB
    // of fields altogether refuses the entry. app_id, component, trace_id
    // and span_id are identifiers and are refused over 1 KiB rather than cut.
    // Together with the 64 KiB message cap this bounds one stored entry,
    // which is what lets a query page always fit one frame.
    map<string, string> fields = 6;

    // Trace ID (for distributed tracing)
    string trace_id = 7;

    // Span ID
    string span_id = 8;
}

// Push logs request
message PushLogsRequest {
    // Batched log entries
    repeated LogEntry entries = 1;

    // Request metadata
    map<string, string> metadata = 2;
}

// Push logs response
message PushLogsResponse {
    // Number of log entries successfully accepted
    int32 accepted_count = 1;

    // Number of log entries rejected
    int32 rejected_count = 2;

    // Error message (if any)
    string error_message = 3;
}

// Query stored logs. Every filter is optional; an unset filter matches
// everything. Filters combine with AND.
message QueryRequest {
    // Only this application; empty matches every application
    string app_id = 1;

    // Inclusive lower bound on timestamp_us; 0 means unbounded
    int64 start_us = 2;

    // Exclusive upper bound on timestamp_us; 0 means unbounded
    int64 end_us = 3;

    // Minimum severity, comparing the LogLevel ordinal;
    // LOG_LEVEL_UNSPECIFIED means no floor
    LogLevel min_level = 4;

    // Exact trace ID; empty matches every trace
    string trace_id = 5;

    // Case-insensitive substring of the message; empty matches every message
    string contains = 6;

    // Page size. 0 selects the server default, values above the server
    // maximum are clamped down to it. A page may also hold fewer entries
    // than this: it is closed early when the next entry would take it past
    // the server's byte budget (half the 16 MiB frame), and then has_more is
    // true and next_cursor is set like any other short page. A reader that
    // wants `limit` entries follows the cursor; a short page is not the end
    // of the data.
    int32 limit = 7;

    // Opaque continuation token taken from a previous QueryResponse.
    // Empty starts at the newest matching entry.
    string cursor = 8;
}

// Query result page, newest entry first
message QueryResponse {
    // Matching entries, ordered newest first
    repeated LogEntry entries = 1;

    // Token to pass back as QueryRequest.cursor for the next, older page.
    // Empty when this page is the last one.
    string next_cursor = 2;

    // True when at least one older matching entry exists
    bool has_more = 3;
}

// Follow logs as they are ingested. Only entries that arrive after the call
// are streamed; use Query for anything already stored.
message TailRequest {
    // Only this application; empty follows every application
    string app_id = 1;

    // Minimum severity; LOG_LEVEL_UNSPECIFIED means no floor
    LogLevel min_level = 2;
}

// What kind of invocation a trace record describes. Every entry point the
// runtime has is one of these; an invocation the runtime cannot classify
// arrives as UNSPECIFIED rather than being forced into the wrong bucket.
enum InvocationKind {
    INVOCATION_KIND_UNSPECIFIED = 0;
    INVOCATION_KIND_HTTP_REQUEST = 1;
    INVOCATION_KIND_QUEUE_BATCH = 2;
    INVOCATION_KIND_CRON_TICK = 3;
    INVOCATION_KIND_WEBSOCKET_MESSAGE = 4;
}

// How the platform decided the invocation ended.
//
// The split between "the application failed" and "we stopped it" is the
// point of this enum: an operator reading a 500 cannot tell a handler that
// threw from a handler the node killed, and only the runtime knows which it
// was. Each cut-off is its own value because each has a different fix -- a
// slow handler, a handler hammering the op layer, a handler eating the heap.
enum InvocationOutcome {
    INVOCATION_OUTCOME_UNSPECIFIED = 0;

    // The handler returned and the platform served what it returned.
    INVOCATION_OUTCOME_OK = 1;

    // The application's own failure: an uncaught exception, or a 5xx it
    // chose to answer with.
    INVOCATION_OUTCOME_APPLICATION_ERROR = 2;

    // Cut off by the wall-clock execution budget.
    INVOCATION_OUTCOME_EXECUTION_TIMEOUT = 3;

    // Cut off by the op dispatch rate limiter.
    INVOCATION_OUTCOME_RATE_LIMITED = 4;

    // Cut off by the isolate's heap ceiling.
    INVOCATION_OUTCOME_MEMORY_LIMIT = 5;

    // The platform failed around the application: the bundle would not load,
    // the handler answered with something unparseable, a dependency was
    // unreachable. Not the application's fault and not a budget.
    INVOCATION_OUTCOME_INTERNAL_ERROR = 6;

    // Cut off by the CPU-time ceiling. Its own value rather than sharing
    // EXECUTION_TIMEOUT's: a duration cut-off usually points downstream of
    // the application, a CPU cut-off always points at the application.
    INVOCATION_OUTCOME_CPU_LIMIT = 7;
}

// One invocation of one application.
//
// Higher volume than logs by construction - one record per invocation,
// whether or not the application logged anything - so producers sample and
// this service keeps them for fewer days than logs. Both of those losses are
// counted rather than silent; see PushTracesRequest.
message TraceRecord {
    // Ties this invocation to the log lines it wrote: LogEntry.trace_id
    // carries the same value, so LogService.Query with this trace_id is the
    // invocation's log.
    string trace_id = 1;

    // When the invocation started (microseconds since the Unix epoch). 0 is
    // stamped with the server receive time; negative, more than an hour
    // ahead, or older than the trace retention window is refused, for the
    // reasons LogEntry.timestamp_us gives.
    int64 started_us = 2;

    // How long it ran, in microseconds. Includes the time a cut-off
    // invocation ran before it was stopped.
    int64 duration_us = 3;

    // The application, not the storage tenant, so a query for an application
    // answers with every environment of it.
    string app_id = 4;

    // The environment half of the tenant, e.g. "production", "preview".
    string environment = 5;

    // The node that ran it. This service has no node dimension of its own;
    // the node travels here because two nodes serving one application
    // otherwise produce records nobody can tell apart.
    string node = 6;

    InvocationKind kind = 7;
    InvocationOutcome outcome = 8;

    // What the invocation was aimed at: the request URL, the queue name, the
    // cron expression, the WebSocket path.
    string target = 9;

    // HTTP method. Empty for every other kind.
    string method = 10;

    // HTTP status the client was given; 0 when the invocation has no status.
    int32 status = 11;

    // The uncaught exception, or why the platform cut the invocation off.
    // Empty when it ended cleanly.
    string error = 12;

    // Extra dimensions: a queue batch's message counts, a retry number.
    // Bounded the way LogEntry.fields is: keys over 256 bytes refuse the
    // record, values are cut at 16 KiB, more than 64 KiB altogether refuses
    // the record. trace_id, app_id, environment, node and method are refused
    // over 1 KiB.
    map<string, string> attributes = 13;
}

// Push trace records.
message PushTracesRequest {
    // Batched records
    repeated TraceRecord records = 1;

    // Invocations the producer deliberately did not record since its previous
    // push, because sampling did not select them. A gap in the traces is then
    // a number an operator can read rather than nothing at all.
    uint64 sampled_out = 2;

    // Records the producer built and then lost because its own buffer was
    // full. Unlike `sampled_out` this is a fault, not a policy.
    uint64 dropped = 3;

    // Request metadata
    map<string, string> metadata = 4;
}

// Push trace records response
message PushTracesResponse {
    // Number of records successfully accepted
    int32 accepted_count = 1;

    // Number of records rejected
    int32 rejected_count = 2;

    // Error message (if any)
    string error_message = 3;
}

// Query stored traces. Every filter is optional; filters combine with AND.
//
// "Which invocations failed in the last hour" is this message with
// `start_us` an hour ago and `outcomes` listing everything but
// INVOCATION_OUTCOME_OK.
message QueryTracesRequest {
    // Only this application; empty matches every application
    string app_id = 1;

    // Only this environment; empty matches every environment
    string environment = 2;

    // Inclusive lower bound on started_us; 0 means unbounded
    int64 start_us = 3;

    // Exclusive upper bound on started_us; 0 means unbounded
    int64 end_us = 4;

    // Empty matches every kind
    repeated InvocationKind kinds = 5;

    // Empty matches every outcome
    repeated InvocationOutcome outcomes = 6;

    // Exact trace ID; empty matches every trace
    string trace_id = 7;

    // Only invocations that ran at least this long; 0 means no floor
    int64 min_duration_us = 8;

    // Case-insensitive substring of `target`; empty matches every target
    string target_contains = 9;

    // Page size. 0 selects the server default, values above the server
    // maximum are clamped down to it. Also closed early at the server's
    // byte budget, with has_more and next_cursor set; see QueryRequest.limit.
    int32 limit = 10;

    // Opaque continuation token taken from a previous QueryTracesResponse
    string cursor = 11;
}

// Trace query result page, newest invocation first
message QueryTracesResponse {
    repeated TraceRecord records = 1;

    // Token to pass back as QueryTracesRequest.cursor for the next, older
    // page. Empty when this page is the last one.
    string next_cursor = 2;

    // True when at least one older matching record exists
    bool has_more = 3;
}

// Follow traces as they are ingested. Only records that arrive after the
// call are streamed; use QueryTraces for anything already stored.
message TailTracesRequest {
    // Only this application; empty follows every application
    string app_id = 1;

    // Only this environment; empty follows every environment
    string environment = 2;

    // Empty follows every kind
    repeated InvocationKind kinds = 3;

    // Empty follows every outcome
    repeated InvocationOutcome outcomes = 4;
}

// One numeric sample of one metric at one point in time
message MetricSample {
    // Metric name, for example "deis_runtime_requests_total"
    string name = 1;

    // Application ID the sample belongs to; empty for component-level metrics
    string app_id = 2;

    // Additional dimensions
    // Labels name the series, so they are never cut: a key over 256 bytes,
    // or more than 4 KiB of labels altogether, refuses the sample. name and
    // app_id are refused over 1 KiB.
    map<string, string> labels = 3;

    // Sample value
    double value = 4;

    // Timestamp (microseconds since the Unix epoch). 0 is stamped with the
    // server receive time; negative, more than an hour ahead, or older than
    // the metric retention window is refused, for the reasons
    // LogEntry.timestamp_us gives.
    int64 timestamp_us = 5;
}

// Push metric samples request
message PushMetricsRequest {
    // Batched samples
    repeated MetricSample samples = 1;

    // Request metadata
    map<string, string> metadata = 2;
}

// Push metric samples response
message PushMetricsResponse {
    // Number of samples successfully accepted
    int32 accepted_count = 1;

    // Number of samples rejected
    int32 rejected_count = 2;

    // Error message (if any)
    string error_message = 3;
}

// Query stored metric samples. Every filter is optional; filters combine
// with AND.
message QueryMetricsRequest {
    // Exact metric name; empty matches every metric
    string name = 1;

    // Only this application; empty matches every application
    string app_id = 2;

    // Every entry must be present on the sample with the same value;
    // the sample may carry additional labels
    map<string, string> label_selector = 3;

    // Inclusive lower bound on timestamp_us; 0 means unbounded
    int64 start_us = 4;

    // Exclusive upper bound on timestamp_us; 0 means unbounded
    int64 end_us = 5;

    // Page size. 0 selects the server default, values above the server
    // maximum are clamped down to it. Also closed early at the server's
    // byte budget, with has_more and next_cursor set; see QueryRequest.limit.
    int32 limit = 6;

    // Opaque continuation token taken from a previous QueryMetricsResponse
    string cursor = 7;
}

// Metric query result page, newest sample first
message QueryMetricsResponse {
    // Matching samples, ordered newest first
    repeated MetricSample samples = 1;

    // Token to pass back as QueryMetricsRequest.cursor for the next,
    // older page. Empty when this page is the last one.
    string next_cursor = 2;

    // True when at least one older matching sample exists
    bool has_more = 3;
}
