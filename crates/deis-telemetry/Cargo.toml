[package]
name = "deis-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Deislet log aggregation and metrics"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
deis-wire = { workspace = true }
deis-backend-migration = { path = "../deis-backend-migration" }
deis-capability = { path = "../deis-capability", features = ["jwks-fetch"] }
deis-identity = { path = "../deis-identity" }
tokio-rustls = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tonic = "0.12"
tonic-health = "0.12"
prost = "0.13"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
axum = "0.7"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
uuid = { version = "1.12", features = ["v4"] }
sha2 = "0.10"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2.2"
deis-identity-test-pki = { path = "../deis-identity-test-pki" }
