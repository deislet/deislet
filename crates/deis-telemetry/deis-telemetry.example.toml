# deis-telemetry configuration. Every key but [machine_identity] is optional,
# and the values below are the defaults. [machine_identity], at the end, is
# what the gRPC listener is served with; the offline subcommands do not need it.

# gRPC endpoint. Four always-on services share it: LogService (PushLogs / Query /
# Tail), TraceService (PushTraces / QueryTraces / TailTraces), MetricService
# (PushMetrics / QueryMetrics) and the standard grpc.health.v1 service, which
# is the only health surface this process offers. That one answers NOT_SERVING
# whenever the database underneath has stopped taking writes or reads, so a
# probe on it is worth having: a collector that reports healthy while
# refusing every log line is worse than one that reports broken. An optional
# fifth BackendMigration service appears only when migration_admin_token is
# configured and uses that independent credential.
#
# Every call on either port - push, query, follow, scrape - must carry a
# capability deis-control signed; there is no mode without that check, so these
# may be bound beyond loopback. The health service is exempt: it names no
# application and reads no data. See src/auth.rs for what each capability may
# touch.
listen = "127.0.0.1:8092"

# Prometheus scrape endpoint (HTTP GET /metrics). A separate port so a
# scraper can read the exported numbers without reaching the ingest and
# query RPCs. It serves every application's series at once, so it accepts
# only a platform-wide read capability (GET /api/platform/telemetry-token on
# deis-control, which needs read:*/*).
metrics_listen = "127.0.0.1:8093"

# Independent bearer credential for the optional BackendMigration management
# service. Telemetry producers and readers must not be able to freeze,
# inventory or release a tenant, so this is its own credential. When
# absent, management RPCs are not registered. The durable fence journal is
# still enforced, so removing this setting cannot bypass an active fence.
#
#   openssl rand -hex 32
# migration_admin_token = "put an independent migration token here"

# Directory holding telemetry.sqlite: the logs, traces and metric series.
# It runs in WAL mode, so never back it up with `cp`: a plain copy can omit
# committed WAL pages. Use `deis-telemetry snapshot --out DIR`; restore with
# `deis-telemetry restore --from DIR` while the destination service is
# stopped. The verified snapshot excludes migration-fences.sqlite, and a
# restore creates a fresh backend incarnation. Losing this directory loses
# history, not the ability to serve; see crates/deis-control/DEPLOYMENT.md for
# what the rest of the platform needs backed up.
data_dir = "./data"

# Days of logs to keep. Logs live in one table per UTC day and the sweeper
# drops whole expired tables; dropped logs are gone permanently.
log_retention_days = 7

# Days of metric samples to keep.
metric_retention_days = 30

# Days of traces to keep. Traces live in one table per UTC day like logs and
# the sweeper drops whole expired tables. Shorter than log_retention_days on
# purpose: there is one trace per invocation whether or not the application
# logged anything, so this table grows with traffic rather than with how
# chatty the code is. Raise it only after looking at the disk it costs.
trace_retention_days = 3

# Seconds between retention sweeps. A sweep also runs once at startup.
retention_sweep_interval_secs = 3600

# Entries held in the live fan-out buffer shared by all Tail streams. A
# consumer that falls this far behind loses entries - for that stream only.
# Ingestion is never slowed down, and the entries stay queryable.
tail_capacity = 1024

# Records held in the live trace fan-out buffer shared by all TailTraces
# streams. Separate from tail_capacity, and larger, because traces arrive at
# one record per invocation.
trace_tail_capacity = 4096

# Page size used when a query does not ask for one, and the ceiling a caller
# may ask for (larger requests are clamped, not refused).
query_default_limit = 100
query_max_limit = 1000

# How far back /metrics looks for the latest sample of each series. A series
# with no sample newer than this is left out rather than exported stale.
metrics_export_window_secs = 300

# This service's machine identity: a certificate naming
# spiffe://<trust domain>/deislet/telemetry/<id>, issued by the fleet's
# authority. The gRPC listener presents it to every caller and speaks TLS
# only; callers refuse a server whose certificate does not chain to the
# fleet's trust root or names another kind of machine. `control_endpoint` is
# the control plane's machine channel - http:// is refused unless it names a
# loopback address. Renewed files are picked up every
# `identity_reload_seconds` without a restart. `deis-telemetry serve` refuses
# to start without this table.
#
# [machine_identity]
# certificate = "/etc/deis/telemetry.crt"
# private_key = "/etc/deis/telemetry.key"
# trust_root = "/etc/deis/ca.crt"
# control_endpoint = "https://127.0.0.1:8101"
# identity_reload_seconds = 60
