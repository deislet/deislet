[package]
name = "deis-proxy"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[dependencies]
tokio = { version = "1.45", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { workspace = true }
arc-swap = "1.7"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
regex = "1.11.1"
nix = { version = "0.30.1", features = ["fs", "process", "signal", "user"] }
futures = "0.3"

# Data plane: HTTP proxying, load balancing, TLS termination and
# zero-downtime upgrades. The openssl backend is required for per-SNI
# certificate selection; the rustls backend does not support handshake
# callbacks in this release.
#
# 0.8.1 is a security floor rather than a preference. 0.5 is vulnerable to
# RUSTSEC-2026-0033 and RUSTSEC-2026-0034, two request smuggling flaws at
# CVSS 9.3: on a multi-tenant edge, smuggling means one tenant's request
# being delivered to another tenant's application. It is also vulnerable to
# RUSTSEC-2025-0070 (MadeYouReset HTTP/2) and, if response caching is ever
# switched on, RUSTSEC-2026-0035. Do not drop below 0.8.0. Two behaviours
# this crate now relies on arrived with those fixes: a connection is only
# switched into tunnel mode once the node has answered 101, and
# `Session::was_upgraded()` reports whether that happened - which is what
# separates a WebSocket from an upload in
# `proxy::DeisProxy::request_body_filter`.
#
# One advisory rides along and no version choice here can clear it:
# pingora-core pulls prometheus 0.13, which pulls protobuf 2.28
# (RUSTSEC-2024-0437, uncontrolled recursion while *parsing* a message).
# Nothing here parses protobuf through that path - prometheus only encodes
# metrics with it, this process serves no metrics endpoint at all, and the
# control-plane gRPC is prost. It is unreachable rather than fixed, and it
# stays in `cargo audit` until pingora drops the dependency.
pingora = { version = "0.8.1", features = ["lb", "openssl"] }

# The same crate pingora's openssl backend is built on, and it must stay the
# same one: `pingora::tls` re-exports only a handful of openssl's modules
# (hash, nid, pkey, ssl, x509) and the ACME client needs several it does not
# re-export - `ec` and `bn` for the P-256 account key, `ecdsa` to turn a DER
# signature into the raw pair ES256 wants, `asn1` to read how many days a
# stored certificate has left. Cargo unifies the two into one 0.10.x, which
# is what lets an `X509` built here be handed to pingora's handshake; a
# version requirement that split them would fail to compile rather than
# fail subtly, but the point is not to try.
openssl = "0.10"

# Control (deis-control) client.
deis-wire = { path = "../deis-wire" }
yasm = "0.5.0"

[dev-dependencies]
# In-process control the client tests register against
# (src/control/mock.rs).
tonic = "0.12"
tokio-stream = { version = "0.1", features = ["net"] }
# Somewhere for tests/upgrade_framing_test.rs to put the configuration, the
# database and the log of the proxy process it starts.
tempfile = "3"
