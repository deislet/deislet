[package]
name = "deis-control"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[dependencies]
deis-bundle = { path = "../deis-bundle" }
deis-artifact = { path = "../deis-artifact" }
deis-provider-driver = { path = "../deis-provider-driver" }
async-trait = "0.1"
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# HTTP framework
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# TLS support
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.0"

# gRPC
tonic = { version = "0.12", features = ["router"] }
prost = "0.13"
tokio-stream = { version = "0.1", features = ["net"] }

# Database
# `fallible_uint` because several queries here bind a `usize` - a row limit, a
# retention count - and rusqlite only implements `ToSql` for it behind that
# feature. Every workspace build already turned it on, because the runtime's
# deno dependencies ask for it, so this changes nothing at runtime; what it
# fixes is that `cargo build -p deis-control` on its own used to fail with
# "the trait bound `usize: ToSql` is not satisfied" in code that had compiled
# for months.
rusqlite = { workspace = true, features = ["fallible_uint"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.2.0"
toml = "0.8"

# Zero-copy config updates
arc-swap = "1.6"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.0"
structopt = "0.3"

# Cron expression parsing (5 fields, Quartz-like), the same crate the
# runtime's own cron support is built on.
saffron = "0.1"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
tempfile = "3"
base64 = "0.22"

# Application bundles: zip container plus streamed HTTP download
zip = "0.6"
walkdir = "2.4"
tokio-util = { version = "0.7", features = ["io"] }

# Secret encryption at rest (AES-256-GCM, nonce prefixed)
aes-gcm = "0.10"

# Embedded static files
rust-embed = "8"
mime_guess = "2"

# OpenAPI document of the human API (`api::openapi`). Core crate only: the
# axum integration crate needs axum 0.8 and this workspace is on 0.7, so the
# routes are described by `#[utoipa::path]` beside each handler and listed
# by hand in the document root.
utoipa = { version = "5.5", features = ["axum_extras", "uuid", "chrono", "preserve_path_order"] }


# Control Wire SDK
deis-wire = { path = "../deis-wire" }
deis-backend-migration = { path = "../deis-backend-migration" }
deis-queue = { path = "../deis-queue" }
# Drives the node session lifecycle (src/session.rs) and the command
# lifecycle (src/database/command_status.rs).
yasm = { workspace = true }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "=3.2.0"

[dev-dependencies]
deis-provider-driver = { path = "../deis-provider-driver", features = ["test-support"] }
ed25519-dalek = "2.2"
tar = "0.4"
reqwest = { version = "0.12", features = ["json"] }
