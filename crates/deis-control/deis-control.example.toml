# deis-control example configuration

# Bind address
bind_addr = "0.0.0.0"

# HTTP API and gRPC port
port = 8080

# Heartbeat configuration (seconds).
#
# heartbeat_interval is how often a node is asked to beat. heartbeat_timeout
# is how long it may then be silent before this control plane stops reporting
# it as live: its session becomes Unresponsive, which is what tells an
# operator apart a node that hung up from one that is still connected and has
# stopped answering - a frozen host, a partition, a power cut.
#
# Keep the timeout at two or three intervals. A healthy node is silent for one
# whole interval between beats, so a timeout at or below the interval marks
# every node unresponsive between its own heartbeats.
heartbeat_interval = 30
heartbeat_timeout = 90

# ========================================
# The machine channel
# ========================================
#
# Deislet's own processes - runtime nodes and deis-proxy - do not talk to the
# port above. They talk here, and they prove who they are with a certificate
# rather than with a password.
#
# Why a listener of its own: the answers served on it are the platform's most
# sensitive. An assignment list carries every environment's DECRYPTED secrets,
# because a node that restarts has to come back with the environment it had,
# and the routing table is a map of every hostname on the platform. This used
# to ride on the same socket as the dashboard, guarded by one string that
# every node in the fleet held a copy of - so whoever held that one string
# could read all of it. Bind this to an interface your nodes reach and nothing
# else does.
#
# Leave the whole section out and this control plane serves no machine channel
# at all: no node can register, fetch assignments or download a bundle, and no
# proxy can fetch a routing table. It will still serve the dashboard.
#
# [machine]
# bind_addr = "10.0.0.1"
# port = 8443
#
# This control plane's own certificate chain, end-entity certificate first,
# and the private key belonging to it. The certificate must carry a SPIFFE URI
# in its subjectAltName naming this control plane, e.g.
# spiffe://deis.internal/control.
# certificate = "/etc/deislet/control.crt.pem"
# private_key = "/etc/deislet/control.key.pem"
#
# What every caller's certificate must chain to. A node or proxy that cannot
# chain to this, or whose certificate names something other than a machine of
# this installation, has its connection closed during the handshake - before
# any request exists to answer.
# trust_root = "/etc/deislet/fleet-ca.crt.pem"
#
# How often the three files above are re-read, in seconds. This is the longest
# a renewal can go unnoticed, so it wants to be far shorter than the shortest
# certificate lifetime in use. A rotation needs no restart.
# identity_reload_seconds = 60
#
# The address nodes reach this listener at. Bundle URLs in an assignment are
# built from it, and it is served here rather than on the dashboard port, so
# public_base_url - which names where a browser finds the dashboard - is the
# wrong address to hand a node.
# public_base_url = "https://10.0.0.1:8443"
#
# Nothing here issues, renews or revokes certificates; that is your PKI's job.
# Any CA that can mint a certificate with a URI subjectAltName will do.

# ========================================
# API authentication
# ========================================

# Authentication is always on. Every endpoint on the human API except /health
# requires a credential - a token minted with `deis token create` - and each
# one is checked against the scopes it carries. /health is the only exception,
# because it answers the constant "OK" and the orchestrator probing it has
# nothing to present.
#
# A control plane that starts with no live credential anywhere mints one
# bootstrap token and writes it to <data_dir>/bootstrap.token (mode 0600). The
# log names the file and the token id, never the value. The bootstrap token
# can do one thing: create the first owner account and its first token, after
# which it is revoked and the file deleted. It expires 24 hours after it was
# minted if unused. Log in with:
#
#   deis login --bootstrap <data_dir>/bootstrap.token
#
# For a headless install you can preset your own bootstrap token instead:
#
#   deis-control bootstrap --token-file /secure/path/bootstrap.token
#
# /api/metrics is not an exception either: it hands out the cluster size, the
# node count, the uptime and the event totals. A Prometheus on another host
# scrapes it with a token of its own -
#
#   deis account create prometheus --role viewer
#   deis token create --account prometheus --scope 'read:*/*' scrape
#
# - which goes in the scrape config's `authorization` block.
#
# A file naming a setting this build does not know - `api_keys`,
# `api_auth_enabled`, anything retired - is refused at startup with a message
# naming the key, rather than silently ignored.

# Origins a web page may read this control plane's answers from
# (default: none)
#
# The console this binary serves comes from this same port, so its calls are
# same-origin and need no entry here; `npm run dev` proxies /api through the
# vite server, so the development console is same-origin too. An entry is
# needed only for a console hosted somewhere else.
#
# This used to be `*` - any origin, all methods, all headers. That meant any
# page the operator happened to visit in a browser on the box could call this
# control plane, create an owner account, mint a root token, deploy, and READ
# every answer. `*` is therefore refused here: an origin that may read the
# audit log has to be named.
#
# Naming an origin is not authority. A page on another origin presents a
# token like any other remote caller.
#
# Write each origin in full, with the scheme and the port, and no trailing
# slash - that is what a browser sends, and an entry in any other shape can
# never match. Bad entries are dropped with an ERROR line at startup.
#
# api_cors_allowed_origins = ["https://console.example.com"]
api_cors_allowed_origins = []

# ========================================
# Which runtime nodes exist
# ========================================

# A node normally puts itself on the fleet list: it opens a connection to the
# machine channel, proves a certificate naming itself, and calls Register with
# the address it can be driven at. From then on it receives deployment pushes
# and is eligible to run cron occurrences. So this list is a
# fallback, not the source of truth, and a machine can join a running
# platform without this file being edited.
#
# What the list is still for: a control plane and its nodes started together
# by one script, where the control plane may have to reach a node before
# that node has managed to call in - and a node that must stay a delivery
# target even while it is down, because an entry from here never expires
# while a registration does.
#
# [[deis_runtime_nodes]]
# id = "node-a"
# addr = "http://127.0.0.1:8086"

# Seconds between health probes of every known node (default: 15). The same
# tick drops registrations nobody refreshed.
# deis_runtime_poll_interval = 15

# Seconds a self-registered node stays on the fleet list without refreshing
# its registration (default: 90). A node refreshes every third of this, so
# two lost refreshes do not cost a healthy node its place. When it does
# expire the node stops receiving deployment pushes and cron fires, is not
# told, and comes back on its own the next time it registers. It is not
# forgotten in the meantime: a node that stopped refreshing is still serving
# what it last received, so every deploy and every application deletion names
# it as a node they could not reach until it registers again - or until
# DELETE /api/nodes/{id}/registration says the machine is really gone. Nodes
# listed above are not subject to any of this.
# node_registration_ttl_secs = 90

# How long a deployment whose pointer has already moved waits for a target
# that has left the fleet, before recording it as abandoned and letting the
# plan finish. Default 600 seconds.
#
# It exists because a plan freezes its target list and reaches its terminal
# state only when every name in it has confirmed the exact generation. That is
# right for a machine that is merely quiet, and it means a machine that never
# comes back holds the environment for ever: every following deployment to it
# is refused with "a deployment plan is already in progress", and no operator
# action clears it.
#
# Only a target that is not on the fleet list at that moment is ever given up
# on. A target that is listed and failing is waited for indefinitely, which is
# a machine with a problem and has to stay visible as one.
#
# Make it comfortably longer than node_registration_ttl_secs plus however long
# a machine here takes to reboot: a restarting node is off the list for the
# rest of its registration lifetime plus its boot time. Giving up on it early
# costs nothing permanent - a node asks what it should be running every time
# it starts, so one that returns loads the current version on its own - but it
# does put an "abandoned" row in that plan where a confirmation should be.
# deployment_target_abandon_after_secs = 600

# ========================================
# Product model: bundles and secrets
# ========================================

# Directory holding uploaded application bundles: one sub-directory per
# app, one content-addressed zip per version. This is the only copy of a
# version's code the platform keeps, so put it on persistent storage -
# and on the same storage as the database, because a restore needs both.
#
# Left out, it is <data_dir>/bundles below. Give it a path elsewhere only
# when there is a reason, and then back that path up too: the documented
# policy covers data_dir, and a restore of it alone would find the
# database's version rows and none of the zips they name.
#
# It has to be absolute. A relative path is refused at startup, because it
# names a different directory to every process started from a different
# working directory - and every uploaded version is then somewhere the
# process is not looking.
#
# One thing is repaired at startup: a version row whose path was stored
# relative by an earlier run is re-anchored under whatever bundle_dir now
# resolves to, and the startup log says how many were moved and how many of
# them have no file there.
bundle_dir = "/var/lib/deis-control/bundles"

# Directory holding this installation's own state, and the one directory a
# backup policy has to cover (ADR-012):
#
#   control.db        the catalogue                            (--database)
#   bundles/          every version's code                    (bundle_dir)
#   keys/             the master key that decrypts what the database holds
#   machine/          the machine channel's certificate, its key and the
#                     trust root every node and proxy chains to
#
# The one-time bootstrap credential is written here on a first start too,
# and is deliberately not part of a restore: it is a way in rather than
# state, and a restored installation mints a fresh one by itself.
#
# Absolute, and for the same reason as bundle_dir. A control plane started
# with a relative one writes its database, its bundles and its keys into
# whatever directory it was started in, and looks perfectly healthy doing
# it.
data_dir = "/var/lib/deis-control"

# Absolute base URL nodes use to reach this control plane. It ends up in
# the bundle download links handed out with each assignment. Leave it unset
# and the bind-derived fallback is used. Set it whenever nodes are on another
# host or reach the control plane through a proxy.
# public_base_url = "https://control.internal:8080"

# File holding the 32-byte master key that encrypts environment secrets and
# the capability signing keys (AES-256-GCM, nonce prefixed). Either 32 raw
# bytes or 64 hex characters:
#   openssl rand -hex 32 > /etc/deis/secret.key && chmod 600 /etc/deis/secret.key
# The key never enters the database and is never logged. Required: the
# control plane refuses to start without it, because it cannot sign a single
# storage or queue capability without a signing key it can keep.
# secret_key_file = "/etc/deis/secret.key"

# ========================================
# Routing: how a request finds an application
# ========================================

# Routes live in the catalog, one per app + environment, created with
#   POST /api/apps/{app_id}/environments/{env}/routes
# or through the dashboard. Each binds a host and a path prefix, so
# example.com/api/* and example.com/* can serve different applications and
# different environments of the same one.
#
# A hostname is the one namespace on this platform that is global: an app id
# belongs to whoever made the app and an environment name belongs to its app,
# so a scope (deploy:<app>/<env>) can spell both, and nothing in that grammar
# can say who owns example.com. So ownership is a table, not a scope, and it
# is written through the API rather than through this file - one control
# plane can feed several edges and outlive any file on this machine:
#
#   POST /api/domains {"pattern": "*.example.com", "app_id": "shop"}
#
# A route claiming a name no grant covers is refused, for everybody. That is
# deliberate: without it, a credential scoped to one preview environment
# could post any hostname on the internet into its own environment's route
# list and take delivery of every request to it. On the first start after an
# upgrade, every host this installation already routes becomes a grant to the
# application that routes it, so nothing that already works stops working;
# only a new name needs a decision. GET /api/domains is then the list of who
# holds what.
#
# deis-proxy reads the whole table over the machine channel, on a connection
# where it proved a certificate naming itself as a proxy of this installation,
# and swaps the table in as one piece. There is nothing
# to configure here: the polling interval belongs to the edge, in
# deis-proxy's own [routing] section, together with preview_zone - the
# domain under which every environment gets an automatic address. Those two
# live there because they have to agree with the DNS record and the wildcard
# certificate that machine holds, and because one control plane can feed
# several edges serving different zones.
#
# What that means operationally: a route created here reaches the edge
# within one of its poll intervals, with no restart. While this control
# plane is down, every edge keeps serving on the last table it fetched -
# routing simply stops changing.

# ========================================
# Storage services and cron
# ========================================

# gRPC addresses of deis-store and deis-queue, as a node has to dial them,
# plus deis-telemetry as the identity-migration coordinator must dial it.
# The control plane owns the storage addresses and hands those down with every
# deployment; they are deliberately not written into a node's own file, so
# moving a service does not mean editing every node. telemetry_endpoint is
# used here only for its independently authenticated migration management
# surface; runtime/CLI telemetry delivery has its own configuration.
#
# Leave them unset and applications that declare kv / database / blob /
# queue still load, but every ctx.services call they make answers "service
# not available" and their declared queue consumers never start.
#
# They are addresses, not credentials, and are logged like any variable.
# store_endpoint = "http://127.0.0.1:8090"
# queue_endpoint = "http://127.0.0.1:8091"
# telemetry_endpoint = "http://127.0.0.1:8092"

# There is no storage secret to configure. Calls to deis-store and deis-queue
# carry Ed25519 capabilities this control plane signs with keys it keeps in
# its own database, encrypted under secret_key_file above and rotated on
# their own; the two services fetch the public keys from
# /.well-known/deis/capability-jwks.json on this listener (their
# capability_jwks_url setting).

# Independent backend-migration administrator credentials. Each value must
# match migration_admin_token on the corresponding service, contain at least
# 32 bytes, and be different from every application, node, human API and
# other-backend credential. Control keeps them on its management side; they
# are never handed to a runtime node, application, browser or CLI.
#
# All three are required before POST /api/apps/<app>/identity-migration will
# plan or fence anything. Generate three values, not one copied repeatedly:
#
#   openssl rand -hex 32
#   openssl rand -hex 32
#   openssl rand -hex 32
# store_migration_admin_token = "put the deis-store migration token here"
# queue_migration_admin_token = "put the deis-queue migration token here"
# telemetry_migration_admin_token = "put the deis-telemetry migration token here"

# Coordinated platform restore remains unavailable unless both absolute paths
# are configured. Control starts the fixed executable directly, sends the
# immutable restore set on stdin, and waits at most this many seconds. The
# driver's own example config names systemd units, data directories and its
# durable journal directory.
# backend_restore_driver_executable = "/usr/local/bin/deis-backend-topology"
# backend_restore_driver_config = "/etc/deislet/deis-backend-topology.toml"
# backend_restore_driver_timeout_secs = 900

# Absolute, pre-created root for content-addressed provider driver releases.
# External provider execution stays disabled when this is unset. On Unix,
# create it as the Control service account with mode 0700; Control refuses a
# symlink or a directory writable by group/others and never searches PATH. On
# Windows, protect the DACL from inheritance, make the Control service SID the
# owner, and grant mutation rights only to that SID, LocalSystem, and built-in
# Administrators; Control keeps a non-delete-sharing handle open for its life.
# provider_driver_installation_root = "/var/lib/deis-control/provider-drivers"
# Out-of-band public trust root for DSSE release authorization, transparency
# logs, and independent witnesses. Configure it together with the installation
# root; either one alone keeps execution off. The trust-root and rotation files
# must follow the same Unix ownership/mode or Windows service-DACL policy.
# provider_driver_trust_root = "/etc/deis-control/provider-driver-trust-root.json"
# Set this only while advancing to the configured trust root. It is a DSSE
# envelope over that exact next root, signed independently by the thresholds of
# both the previously durable root role and the new root role.
# provider_driver_trust_root_rotation = "/etc/deis-control/provider-driver-trust-root-rotation.json"

# Durable provider deployments are scanned independently of HTTP requests.
# Fresh work starts on the next scan; provider-directed retry/reconciliation
# waits at least this delay. One process runs at most this many driver children
# concurrently, while durable owner/epoch leases fence multiple Control nodes.
# provider_deployment_dispatch_interval_secs = 2
# provider_deployment_retry_delay_secs = 30
# provider_deployment_max_concurrency = 4

# Seconds between cron scheduler ticks (1..=60). A tick rebuilds the task
# list from the catalog and fires whatever came due, so the default means a
# newly deployed schedule is noticed within a minute and fires within a
# minute of being due. Lower it when a deployment should start ticking
# promptly, at the cost of one catalog read per tick.
# cron_tick_seconds = 60

# ========================================
# TLS / HTTPS configuration (optional)
# ========================================

# The three fields go together: uncomment the section as a whole. cert_path
# and key_path have no defaults, so a [tls] section without them stops the
# control plane from reading this file at all.
#
# [tls]
# api_enabled = true          # HTTPS on the port this control plane serves,
#                             # which carries the REST API and the node gRPC
#                             # channel together
# cert_path = "/path/to/fullchain.pem"   # PEM certificate
# key_path = "/path/to/privkey.pem"      # PEM private key
#
# Self-signed certificate for testing:
#   openssl req -x509 -newkey rsa:4096 -nodes \
#     -keyout key.pem -out cert.pem -days 365 -subj "/CN=localhost"
#
# Let's Encrypt in production:
#   certbot certonly --standalone -d your-domain.com
#   cert_path = "/etc/letsencrypt/live/your-domain.com/fullchain.pem"
#   key_path  = "/etc/letsencrypt/live/your-domain.com/privkey.pem"

# ========================================
# Usage
# ========================================

# 1. Copy this file to deis-control.toml
# 2. Fill in the [machine] section with this control plane's certificate,
#    key and trust root
# 3. Start Control: ./deis-control --config deis-control.toml
#    A first start writes <data_dir>/bootstrap.token; log in with
#    `deis login --bootstrap <data_dir>/bootstrap.token`
#
# This is the only example configuration for deis-control, matching
# deis-store.example.toml / deis-queue.example.toml /
# deis-telemetry.example.toml.

# Example API requests:
# deis login --bootstrap data/bootstrap.token
# deis account create alice --role owner
# deis token create --account alice --scope 'read:*/*' scrape
# curl -H "Authorization: Bearer <token>" http://localhost:8080/api/platform/sessions
# or
# curl -H "Authorization: Bearer deis-control-admin-key-1234567890abcdef" http://localhost:8080/api/runtime

# Endpoints that do not require an API key:
# - /health - Health check, and the only one. It answers a constant, so a
#   prober learns nothing a TCP connect had not already told it.
#
# The calls Deislet's own processes make are not on this port at all. They are
# served on the [machine] listener, which demands a certificate: Register and
# Deregister, FetchAssignments, FetchRoutingTable, and the bundle download at
# GET /api/apps/{app_id}/versions/{version_id}/bundle.

# ========================================
# Security recommendations
# ========================================
# 1. Generate strong random keys: openssl rand -hex 32
# 2. Never commit real keys to version control
# 3. Rotate keys periodically, and use different ones per deployment
# 4. Always terminate TLS in production, here or at a reverse proxy
# 5. Bind to 127.0.0.1 when the control plane and its nodes share a host
