# Control Supervisor example configuration

# Bind address
bind_addr = "0.0.0.0"

# HTTP API and gRPC port
port = 8080

# Heartbeat configuration (seconds)
heartbeat_interval = 30
heartbeat_timeout = 90

# Worker pre-shared keys (used for gRPC authentication)
worker_preshared_keys = [
    "your-worker-psk-here-change-this-in-production"
]

# ========================================
# API authentication configuration
# ========================================

# Enable HTTP API authentication (default: false)
# When set to true, all API endpoints (except /health and /api/metrics) require an API Key
api_auth_enabled = true

# API Keys list
# Clients can provide the API Key in either of the following ways:
# 1. Authorization: Bearer <api_key>
# 2. X-API-Key: <api_key>
api_keys = [
    "deis-control-admin-key-1234567890abcdef",      # Admin key
    "deis-control-readonly-key-fedcba0987654321",   # Read-only key (reserved for future use)
]

# ========================================
# TLS configuration (optional)
# ========================================

[tls]
# Enable TLS for the HTTP API
api_enabled = false

# TLS certificate paths
# cert_path = "/path/to/cert.pem"
# key_path = "/path/to/key.pem"

# ========================================
# Usage
# ========================================

# 1. Copy this file to deis-control.toml
# 2. Change worker_preshared_keys and api_keys to secure random strings
# 3. To enable authentication, set api_auth_enabled = true
# 4. Start Control: ./deis-control --config deis-control.toml

# Example API requests (with authentication enabled):
# curl -H "X-API-Key: deis-control-admin-key-1234567890abcdef" http://localhost:8080/api/workers
# or
# curl -H "Authorization: Bearer deis-control-admin-key-1234567890abcdef" http://localhost:8080/api/workers

# Endpoints that do not require authentication:
# - /health - Health check
# - /api/metrics - Prometheus Metrics
