# deis-control example configuration

# Bind address
bind_addr = "0.0.0.0"

# HTTP API and gRPC port
port = 8080

# Heartbeat configuration (seconds)
heartbeat_interval = 30
heartbeat_timeout = 90

# Node pre-shared keys.
#
# One credential, used on every channel a runtime node talks to:
#   - the gRPC registration handshake,
#   - PUT/DELETE /api/nodes/{node_id}/registration, by which a node puts
#     itself on the fleet list, and
#   - the two HTTP endpoints it reads from,
#     GET /api/nodes/{node_id}/assignments and the bundle download.
#
# The assignment list answers with every environment's DECRYPTED secrets,
# because a node that restarts has to come back with the environment it
# had. So those endpoints authenticate with this list whatever
# api_auth_enabled says below, and an API key is not accepted on them.
#
# Leave this empty and the control plane cannot tell a node from any other
# caller, so it serves none of them: those endpoints answer 503 and no node
# can register, fetch assignments or download a bundle. Rather than start
# that way, the control plane generates a key on startup and prints it once
# in a WARN line - copy it into this list and into every node, because it is
# a different key after the next restart.
#
#   openssl rand -hex 32
node_preshared_keys = [
    "your-node-psk-here-change-this-in-production"
]

# ========================================
# API authentication configuration
# ========================================

# Enable HTTP API authentication (default: false)
#
# Covers the dashboard and the human API: with it on, every endpoint except
# /health and /api/metrics requires one of the api_keys below.
#
# It does NOT cover the node endpoints, which always use
# node_preshared_keys - see above. Turning this off makes a dashboard
# convenient; it must never be able to publish the platform's secrets.
api_auth_enabled = true

# API Keys list
# Clients can provide the API Key in either of the following ways:
# 1. Authorization: Bearer <api_key>
# 2. X-API-Key: <api_key>
api_keys = [
    "deis-control-admin-key-1234567890abcdef",      # Admin key
    "deis-control-readonly-key-fedcba0987654321",   # Read-only key (reserved for future use)
]

# ========================================
# Which runtime nodes exist
# ========================================

# A node normally puts itself on the fleet list: it calls
#   PUT /api/nodes/{node_id}/registration  {"address": "http://host:8086"}
# with a node_preshared_keys value, and from then on it receives deployment
# pushes and is eligible to run cron occurrences. So this list is a
# fallback, not the source of truth, and a machine can join a running
# platform without this file being edited.
#
# What the list is still for: a control plane and its nodes started together
# by one script, where the control plane may have to reach a node before
# that node has managed to call in - and a node that must stay a delivery
# target even while it is down, because an entry from here never expires
# while a registration does.
#
# [[deis_runtime_nodes]]
# id = "node-a"
# addr = "http://127.0.0.1:8086"

# Seconds between health probes of every known node (default: 15). The same
# tick drops registrations nobody refreshed.
# deis_runtime_poll_interval = 15

# Seconds a self-registered node stays on the fleet list without refreshing
# its registration (default: 90). A node refreshes every third of this, so
# two lost refreshes do not cost a healthy node its place. When it does
# expire the node stops receiving deployment pushes and cron fires, is not
# told, and comes back on its own the next time it registers. Nodes listed
# above are not subject to it.
# node_registration_ttl_secs = 90

# ========================================
# Product model: bundles and secrets
# ========================================

# Directory holding uploaded application bundles: one sub-directory per
# app, one content-addressed zip per version. This is the only copy of a
# version's code the platform keeps, so put it on persistent storage.
bundle_dir = "data/bundles"

# Absolute base URL nodes use to reach this control plane. It ends up in
# the bundle download links handed out with each assignment. Leave it unset
# and the URL is derived from the request's Host header, which is right for
# direct connections and wrong behind a proxy that rewrites it.
# public_base_url = "https://control.internal:8080"

# File holding the 32-byte master key that encrypts environment secrets
# (AES-256-GCM, nonce prefixed). Either 32 raw bytes or 64 hex characters:
#   openssl rand -hex 32 > /etc/deis/secret.key && chmod 600 /etc/deis/secret.key
# The key never enters the database and is never logged. Without it the
# control plane still runs, but every secret endpoint answers 503 rather
# than storing a value in the clear.
# secret_key_file = "/etc/deis/secret.key"

# ========================================
# Storage services and cron
# ========================================

# gRPC addresses of deis-store and deis-queue, as a node has to dial them.
# The control plane owns these and hands them down with every deployment;
# they are deliberately not written into a node's own file, so moving a
# service does not mean editing every node.
#
# Leave them unset and applications that declare kv / database / blob /
# queue still load, but every ctx.services call they make answers "service
# not available" and their declared queue consumers never start.
#
# They are addresses, not credentials, and are logged like any variable.
# store_endpoint = "http://127.0.0.1:8090"
# queue_endpoint = "http://127.0.0.1:8091"

# Shared secret the storage capability tokens are derived from.
#
# THIS MUST BE THE IDENTICAL STRING AS auth_secret ON BOTH deis-store AND
# deis-queue. All three are one setting spelled in three files: set it here
# and mint the wrong thing, or set it on the services and not here, and every
# storage and queue call every application makes is refused with no hint why
# in this file - the reason is on the *other* process's log line. Rotate it
# by changing all three together.
#
# Leave it unset - the default - and no token is minted or shipped, which is
# only safe while store_endpoint and queue_endpoint above point at services
# that likewise have no auth_secret of their own and are bound to loopback.
# The moment either service is configured with an auth_secret, every call
# from every node is refused until this is set to match.
#
#   openssl rand -hex 32
# storage_auth_secret = "put a long random string here"

# Seconds between cron scheduler ticks (1..=60). A tick rebuilds the task
# list from the catalog and fires whatever came due, so the default means a
# newly deployed schedule is noticed within a minute and fires within a
# minute of being due. Lower it when a deployment should start ticking
# promptly, at the cost of one catalog read per tick.
# cron_tick_seconds = 60

# ========================================
# TLS / HTTPS configuration (optional)
# ========================================

# The three fields go together: uncomment the section as a whole. cert_path
# and key_path have no defaults, so a [tls] section without them stops the
# control plane from reading this file at all.
#
# [tls]
# api_enabled = true          # HTTPS on the port this control plane serves,
#                             # which carries the REST API and the node gRPC
#                             # channel together
# cert_path = "/path/to/fullchain.pem"   # PEM certificate
# key_path = "/path/to/privkey.pem"      # PEM private key
#
# Self-signed certificate for testing:
#   openssl req -x509 -newkey rsa:4096 -nodes \
#     -keyout key.pem -out cert.pem -days 365 -subj "/CN=localhost"
#
# Let's Encrypt in production:
#   certbot certonly --standalone -d your-domain.com
#   cert_path = "/etc/letsencrypt/live/your-domain.com/fullchain.pem"
#   key_path  = "/etc/letsencrypt/live/your-domain.com/privkey.pem"

# ========================================
# Usage
# ========================================

# 1. Copy this file to deis-control.toml
# 2. Change node_preshared_keys and api_keys to secure random strings
# 3. To enable the API key requirement, set api_auth_enabled = true
# 4. Start Control: ./deis-control --config deis-control.toml
#
# This is the only example configuration for deis-control, matching
# deis-store.example.toml / deis-queue.example.toml /
# deis-telemetry.example.toml.

# Example API requests (with authentication enabled):
# curl -H "X-API-Key: deis-control-admin-key-1234567890abcdef" http://localhost:8080/api/sessions
# or
# curl -H "Authorization: Bearer deis-control-admin-key-1234567890abcdef" http://localhost:8080/api/runtime

# Endpoints that do not require an API key:
# - /health - Health check
# - /api/metrics - Prometheus Metrics
# - the node endpoints, which require a node_preshared_keys value
#   instead:
#     PUT    /api/nodes/{node_id}/registration
#     DELETE /api/nodes/{node_id}/registration
#     GET    /api/nodes/{node_id}/assignments
#     GET    /api/apps/{app_id}/versions/{version_id}/bundle

# ========================================
# Security recommendations
# ========================================
# 1. Generate strong random keys: openssl rand -hex 32
# 2. Never commit real keys to version control
# 3. Rotate keys periodically, and use different ones per deployment
# 4. Always terminate TLS in production, here or at a reverse proxy
# 5. Bind to 127.0.0.1 when the control plane and its nodes share a host
