# deflux configuration file
#
# This file contains the basic configuration required to run the system.
# Other runtime configuration (upstreams, load balancing, caching, etc.)
# is pushed dynamically by the supervisor.

# Listen addresses and ports
listen_addr = ["127.0.0.1"]  # Both IPv4 and IPv6 are supported
listen_ports = [8080, 8443]  # Listen on multiple ports for each address

# Daemon configuration
user = "nobody"
group = "nogroup"

# Detailed daemon configuration
[daemon_config]
pid_file = "/tmp/deflux.pid"
stdout_file = "/tmp/deflux.out"
stderr_file = "/tmp/deflux.err"
work_dir = "/d/deislet/deflux"
umask = 0o022
chown_pid = false

# Logging configuration
[log.error_log]
level = "debug"  # Allowed values: error, warn, info, debug, trace
path = "./error.log"

# Runtime configuration
[runtime]
worker_threads_factor = 2  # Multiplier of the number of CPU cores
max_blocking_threads = 128
event_interval = 30  # milliseconds
global_queue_interval = 15  # milliseconds

# Supervisor configuration
[supervisor]
addr = "ws://127.0.0.1:9001"
associated_id = "deflux-worker-001"
secret = "a1b2c3d4e5f67890123456789012345678901234567890123456789012345678"
