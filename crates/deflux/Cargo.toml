[package]
name = "deflux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[dependencies]
# External dependencies
tokio = { version = "1.45", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { workspace = true }
arc-swap = "1.7"
async-trait = "0.1"
http = "1.3"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
thiserror = "2.0"
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"

# Pingora dependencies
pingora = { version = "0.5", features = ["lb"] }
pingora-proxy = "0.5"
pingora-load-balancing = "0.5"
pingora-cache = "0.5"

# Security and communication
nonce-auth = "0.4.0"
denira-workit = { path = "../workit" }
yasm = "0.5.0"
regex = "1.11.1"
nix = { version = "0.30.1", features = ["process", "signal", "user", "fs", "socket", "uio"] }
tokio-tungstenite = "0.27.0"
futures-util = "0.3.31"
num_cpus = "1.17.0"
futures = "0.3.31"
daemonize-me = "2.0"
users = "0.11.0"

[dev-dependencies]
tempfile = "3.20.0"
