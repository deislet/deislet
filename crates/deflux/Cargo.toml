[package]
name = "deflux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["kookyleo <kookyleo@gmail.com>"]

[dependencies]
tokio = { version = "1.45", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { workspace = true }
arc-swap = "1.7"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
regex = "1.11.1"
nix = { version = "0.30.1", features = ["process", "signal"] }

# Data plane: HTTP proxying, load balancing, TLS termination and
# zero-downtime upgrades. The openssl backend is required for per-SNI
# certificate selection; the rustls backend does not support handshake
# callbacks in this release.
pingora = { version = "0.5", features = ["lb", "openssl"] }

# Supervisor (denira) client.
denira-workit = { path = "../workit" }
yasm = "0.5.0"

# Only used by the mock supervisor binary (src/bin/mock_superv.rs).
tonic = "0.12"
tokio-stream = "0.1"
uuid = { version = "1.17", features = ["v4", "serde"] }
