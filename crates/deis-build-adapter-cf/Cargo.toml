[package]
name = "deis-build-adapter-cf"
version = "0.1.0"
edition = "2021"
authors = ["kookyleo <kookyleo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/deislet/deis-build"
homepage = "https://github.com/deislet/deis-build"
description = "Cloudflare Workers adapter for deis-build"

[dependencies]
deis-build-core = { version = "0.1.0", path = "../deis-build-core" }

handlebars = "5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.4"
