# What is meant to run on every push and pull request.
#
# Until this file grew the three jobs below it held one check that needed no
# build, and a comment explaining that a cargo job was for later. The effect
# was that nothing automatic ever compiled this workspace, ran its tests, or
# ran `scripts/demo.sh verify` - the run this project's evidence is quoted
# from. Every one of those was a thing somebody remembered to do on a laptop,
# and the record of it was a sentence in a commit message. A file is not a
# run: until a run of these jobs has been observed, what they prove is what
# they would check, and the README says so where it quotes the numbers.
#
# The build is not free here, and the reason is worth stating once: deis-control
# embeds `crates/deis-control/web/dist` at compile time, so any job that
# compiles it has to `npm ci && npm run build` first or it produces a binary
# that answers 404 for every dashboard page. Both cargo jobs below do that, and
# both cache what it costs.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push supersedes the first: these jobs take minutes, and a queue of
# runs against commits nobody is looking at any more is a queue in front of the
# one somebody is.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing here is a performance measurement and every job starts from a cold
  # target directory or a restored cache, so incremental compilation buys
  # nothing and costs cache size.
  CARGO_INCREMENTAL: 0
  # No debug info in CI builds. The second run of this workflow filled the
  # runner's disk before `demo.sh start` had finished compiling: a debug
  # build of this workspace with full debug info (V8, deno, pingora, tonic)
  # is tens of gigabytes, and the runner starts with about fourteen free.
  # Nothing here reads a debugger; a panic's backtrace still names functions.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  document-path-literals:
    name: documents reference the path constants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails when a document spells out an HTTP path that
      # `deis_wire::conventions` already defines a constant for, and when one
      # is spelled nearly-but-not-quite right. The script explains both rules
      # and names the constant to reference instead.
      - name: Node-facing paths are referenced, not restated
        run: ./scripts/check-doc-path-literals.sh

  demo-witnesses:
    name: the demo's own witnesses hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unit tests for the parts of `demo.sh verify` that decide whether a
      # check passed: the readers of the node's log, the guards that keep one
      # dead component from ending the run without a summary, the roll call
      # that holds the run to the number of checks it lists, and the
      # cross-caller check, run against a stand-in that leaks so that the
      # witness is seen to fail as well as to pass. No build, so it answers in
      # seconds and answers first.
      - name: Witness tests
        run: ./scripts/test-demo-witnesses.sh

  workspace:
    name: build, lint and test the workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The version rust-toolchain.toml pins, spelled here as well because
      # the action installs what it is told and this file must not silently
      # test a different compiler from the one developers run.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/deis-control/web/package-lock.json

      # The runner image ships toolchains this workspace never uses; the
      # space they take is the space the build needs. Same step in the demo
      # job, for the same reason.
      - name: Free disk space
        run: |
          set -eu
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      # The registry and git checkouts only. `target` is not cached: with
      # this workspace it is larger than the cache's per-entry ceiling, so a
      # cached `target` was a slow way of restoring nothing.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-registry-

      # Before anything cargo does. deis-control embeds this directory, and a
      # build without it is a build of a control plane whose dashboard is 404.
      - name: Build the web console deis-control embeds
        working-directory: crates/deis-control/web
        run: |
          npm ci
          npm run build

      # deis-wire's build script compiles the protobuf definitions with
      # `protoc`, which the runner image does not carry. The first run of
      # this workflow failed here, before a line of Rust was checked.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Formatting
        run: cargo fmt --all -- --check

      # `--all-targets` so tests and examples are linted too: a warning in a
      # test file is a warning in this repository.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Tests
        run: cargo test --workspace

  demo:
    name: the demo runs end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/deis-control/web/package-lock.json

      - name: Free disk space
        run: |
          set -eu
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-registry-

      - name: Build the web console deis-control embeds
        working-directory: crates/deis-control/web
        run: |
          npm ci
          npm run build

      # curl, jq, python3, openssl and iproute2 are on the runner already.
      # grpcurl is not, and without it the four checks that ask deis-store and
      # deis-telemetry directly report a failure rather than skipping - which
      # is the right behaviour and would fail this job. Installed from the
      # published release rather than built, and the download is checked
      # against its own checksum file so a job does not run a tarball it
      # cannot identify.
      - name: Install grpcurl
        env:
          GRPCURL_VERSION: 1.9.3
        run: |
          set -euo pipefail
          base="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}"
          curl -sSLf -o grpcurl.tar.gz "${base}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          curl -sSLf -o grpcurl.sha256sum "${base}/grpcurl_${GRPCURL_VERSION}_checksums.txt"
          grep " grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz\$" grpcurl.sha256sum \
            | sed "s/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz/grpcurl.tar.gz/" \
            | sha256sum -c -
          tar -xzf grpcurl.tar.gz grpcurl
          sudo install -m 0755 grpcurl /usr/local/bin/grpcurl
          grpcurl --version

      # Same reason as in the workspace job: `demo.sh start` builds the
      # binaries, and deis-wire's build script needs `protoc`.
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Start the demo
        run: ./scripts/demo.sh start

      # The run this project's claims are quoted from. It prints one line of
      # evidence per check and ends with the tally and the roll call; a check
      # that fails, or a run that does not reach the number of checks the
      # script lists, exits non-zero.
      - name: Verify
        run: ./scripts/demo.sh verify

      - name: Stop the demo
        if: always()
        run: ./scripts/demo.sh stop || true

      # Every component's log, and the per-check transcripts `verify` leaves
      # behind. A failure here is a failure nobody can reproduce by reading
      # the job's output alone: the reason is in these files.
      - name: Keep the run's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-logs
          path: .demo/logs
          retention-days: 7
