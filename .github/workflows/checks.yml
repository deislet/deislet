# What is meant to run on every push and pull request.
#
# Until this file grew the three jobs below it held one check that needed no
# build, and a comment explaining that a cargo job was for later. The effect
# was that nothing automatic ever compiled this workspace, ran its tests, or
# ran `scripts/demo.sh verify` - the run this project's evidence is quoted
# from. Every one of those was a thing somebody remembered to do on a laptop,
# and the record of it was a sentence in a commit message. A file is not a
# run: until a run of these jobs has been observed, what they prove is what
# they would check, and the README says so where it quotes the numbers.
#
# The build is not free here, and the reason is worth stating once: deis-control
# embeds `crates/deis-control/web/dist` at compile time, so any job that
# compiles it has to `npm ci && npm run build` first or it produces a binary
# that answers 404 for every dashboard page. Every job below that compiles
# deis-control does that first.
#
# Where it runs: a self-hosted runner on the build host s7, registered for the
# deislet organisation with the label `deislet`. GitHub-hosted runners stopped
# starting on 2026-09-04 over a billing problem; docs/operations/ci-runner.md
# says how the runner is registered and what it expects to find on the host.
# The host is persistent, so there is no disk to free and no registry cache to
# restore: the cargo registry, the npm cache and the target directory all
# survive between runs, and the target directory is the canonical one that
# `.github/actions/build-host` pins (see that file for why it matters).
#
# Every job carries the same guard against pull requests from forks: the
# runner executes whatever the pull request's workflow and build scripts say,
# on a machine with credentials for the build cluster, so only branches of this
# repository may reach it. The organisation settings refuse fork workflows as
# well; the guard is here so that a settings change alone cannot open it.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first: these jobs take minutes, and a queue of
# runs against commits nobody is looking at any more is a queue in front of the
# one somebody is.
#
# Across refs, the cargo jobs are serialised by the runner itself: exactly one
# runner carries the `deislet` label, and a runner takes one job at a time, so
# two cargo builds never contend for the host (or for one target directory's
# lock). A job-level concurrency group would add nothing to that and would
# cancel a queued run whenever a third arrived.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  product-governance:
    name: product decisions, standard lock and roadmap agree
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, deislet]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The host's own python3 in a throwaway virtual environment: the system
      # interpreter refuses `pip install` outside one (PEP 668), and a venv
      # per run keeps one job's packages out of the next.
      - name: Install governance schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/governance-venv"
          "$RUNNER_TEMP/governance-venv/bin/python" -m pip install --disable-pip-version-check --quiet \
            -r scripts/governance-requirements.txt
          echo "$RUNNER_TEMP/governance-venv/bin" >> "$GITHUB_PATH"
      - name: Validate product governance records
        run: python3 scripts/check-product-governance.py
      - name: Execute shared product contract fixtures
        run: python3 scripts/check-shared-contracts.py
      # The OpenAPI document is generated from the control plane's code and
      # committed; the drift test in deis-control keeps the two equal. This
      # step holds the committed file to its invariants and refuses a change
      # that would break a client written against the document on main unless
      # its major version bumps. The baseline is read off origin/main.
      - name: Hold the Control API OpenAPI document to its compatibility promise
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          python3 scripts/check-openapi-compat.py
      # The web console's TypeScript client is rendered from the same
      # document and committed; a document that changed without the client
      # being regenerated is a console typed against the old contract.
      - name: Reject web client drift from the Control API OpenAPI document
        run: python3 scripts/generate-openapi-types.py --check
      - name: Validate official provider tool source pins
        run: python3 scripts/check-provider-tool-lock.py
      - name: Reject target status drift from the locked registry
        run: python3 scripts/generate-target-status.py --check

  document-counts:
    name: documents carry no hand-written counts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, deislet]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Fails when a maintained document writes down how many checks or tests
      # there are, and when `VERIFY_EXPECTED_CHECKS` disagrees with the sum of
      # the group arrays it is derived from. A count in prose is a second
      # definition of a number the registry already owns, and the two drift.
      - name: No hand-written counts of checks or tests
        run: ./scripts/check-doc-counts.sh

      # The counter-examples first: a planted count and a planted registry
      # mismatch must each be seen to fail before the check is trusted.
      - name: Count check's own counter-examples
        run: ./scripts/check-doc-counts.sh --self-test

  document-links:
    name: documents link at files that exist
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, deislet]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Fails when a relative Markdown link points at a file that does not
      # exist, across every maintained document. docs/archive/ is exempt (its
      # internal links are frozen history), but links from maintained
      # documents into it are checked, so archived files cannot be renamed or
      # deleted again without breaking the build.
      - name: Relative Markdown link targets exist
        run: ./scripts/check-doc-links.sh

  unit-files:
    name: the shipped systemd units verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, deislet]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # verify(8) parses the unit files and checks the directives, without
      # starting anything. The ExecStart binaries are not built here - the
      # workspace job does that - so each unit is verified against a
      # placeholder at the same path, which is enough for the directive
      # checks and for the slice's existence. Noise from the host's own units
      # is filtered rather than failing on it. Scratch files live under
      # RUNNER_TEMP: /tmp on a persistent host is shared with everything else.
      - name: systemd-analyze verify
        run: |
          set -eu
          work="$RUNNER_TEMP/verify-bin"
          rm -rf "$work"
          mkdir -p "$work"
          for unit in scripts/canary/systemd/*.service; do
            name=$(basename "$unit")
            bin=$(grep '^ExecStart=' "$unit" | head -1 | sed 's/^ExecStart=//' | awk '{print $1}')
            touch "$work/$(basename "$bin")"
            chmod +x "$work/$(basename "$bin")"
            sed "s|^ExecStart=.*|ExecStart=$work/$(basename "$bin")|" "$unit" > "$work/$name"
          done
          cp scripts/canary/systemd/deislet.slice "$work/"
          # verify reads the host's own installed units too and reports their
          # unrelated problems; what this job answers for is the files in
          # scripts/canary/systemd/, so only their diagnostics count.
          systemd-analyze verify "$work"/*.service "$work/deislet.slice" \
            2> "$work/verify-err" || true
          echo "---- diagnostics for the shipped units ----"
          grep -F -f <(printf '%s\n' "$work/deis-control.service" "$work/deis-proxy.service" \
            "$work/deis-queue.service" "$work/deis-runtime.service" \
            "$work/deis-store.service" "$work/deis-telemetry.service" \
            "$work/deislet.slice") "$work/verify-err" > "$work/verify-shipped" || true
          cat "$work/verify-shipped"
          if [ -s "$work/verify-shipped" ]; then
            exit 1
          fi

  demo-witnesses:
    name: the demo's own witnesses hold
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, deislet]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Unit tests for the parts of `demo.sh verify` that decide whether a
      # check passed: the readers of the node's log, the guards that keep one
      # dead component from ending the run without a summary, the roll call
      # that holds the run to the number of checks it lists, and the
      # cross-caller check, run against a stand-in that leaks so that the
      # witness is seen to fail as well as to pass. No build, so it answers in
      # seconds and answers first.
      - name: Witness tests
        run: ./scripts/test-demo-witnesses.sh

  workspace:
    name: audit, format, lint, build and test the workspace
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, deislet]
    # One job for every cargo step. The tests used to be three shards on
    # separate GitHub-hosted machines, each with its own cold target
    # directory and its own hand-kept list of crates - and a crate nobody
    # added to a list was never tested at all (deis-capability and
    # deis-provider-driver-cloudflare were in none). On one persistent host
    # the shards bought nothing but three copies of the same compilation, so
    # the tests are now `nextest run --workspace` in the directory the build
    # step has just filled.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-host

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Pinned tools, installed into the runner user's ~/.cargo/bin the first
      # time and found there afterwards (`cargo install` of a version that is
      # already installed does nothing). Outside the canonical target
      # directory, so a tool's build never shares a lock or a cache key with
      # the workspace's.
      - name: Install pinned cargo tools
        run: |
          env -u CARGO_TARGET_DIR cargo install cargo-audit --locked --version 0.22.2
          env -u CARGO_TARGET_DIR cargo install cargo-nextest --locked --version 0.9.146

      # Before anything cargo does. deis-control embeds this directory, and a
      # build without it is a build of a control plane whose dashboard is 404.
      - name: Build the web console deis-control embeds
        working-directory: crates/deis-control/web
        run: |
          npm ci
          # The registry occasionally answers the audit endpoint with a 5xx.
          # Retry that same mandatory check; the final failure still fails the
          # job, so a real high-severity advisory cannot be hidden.
          for attempt in 1 2 3; do
            if timeout 60s npm audit --audit-level=high --fetch-retries=1 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          npm run build
          # The console's own unit tests: what a refused read means to an
          # operator is decided in `src/lib/refusal.ts`, and nothing on the
          # Rust side would notice it regressing.
          npm test

      # Keep the written exceptions in .cargo/audit.toml under review while
      # rejecting every advisory that has not been explicitly judged there.
      - name: Audit Rust dependencies
        run: cargo audit

      - name: Formatting
        run: cargo fmt --all -- --check

      # `--all-targets` so tests and examples are linted too: a warning in a
      # test file is a warning in this repository.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Also what the runtime integration tests need: two of them start the
      # real deis-proxy binary from this target directory, and a package's
      # tests do not build another package's binaries.
      - name: Build
        run: cargo build --workspace

      # Every test of every workspace crate, one process per test. The `ci`
      # profile (.config/nextest.toml) retries a failure once and reports a
      # test that needed it as FLAKY, and writes JUnit next to the run.
      - name: Tests
        run: cargo nextest run --workspace --profile ci

      # nextest does not run documentation tests; `cargo test` did.
      - name: Documentation tests
        run: cargo test --workspace --doc

      - name: Keep the test report
        if: always()
        # Artifact storage is billed to the organisation; a report that cannot
        # be uploaded must not turn a green run red.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: nextest-junit
          # nextest keeps its store under the workspace, not CARGO_TARGET_DIR.
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  demo:
    name: the demo runs end to end
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, deislet]
    timeout-minutes: 45
    # Its own port range. The host is shared with people and agents who run
    # the demo on its defaults (8085-8097); `claim_port` moves past a port in
    # use, but a claim is a hint rather than a reservation, so two demos
    # starting at once on the same range could still take each other's.
    env:
      DEIS_CONTROL_PORT: '18085'
      DEIS_RUNTIME_PORT: '18086'
      DEIS_PROXY_PORT: '18087'
      DEIS_PROXY_TLS_PORT: '18088'
      DEIS_CONTROL_MACHINE_PORT: '18089'
      ACME_CA_PORT: '18095'
      DEIS_STORE_PORT: '18090'
      DEIS_QUEUE_PORT: '18091'
      DEIS_TELEMETRY_PORT: '18092'
      DEIS_TELEMETRY_METRICS_PORT: '18093'
      DEIS_ORIGIN_PORT: '18094'
      DEIS_RUNTIME_MACHINE_PORT: '18097'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-host

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build the web console deis-control embeds
        working-directory: crates/deis-control/web
        run: |
          npm ci
          npm run build

      # curl, jq, python3, openssl and iproute2 are on the host already.
      # grpcurl may not be, and without it the four checks that ask deis-store
      # and deis-telemetry directly report a failure rather than skipping -
      # which is the right behaviour and would fail this job. Installed from
      # the published release into the runner's tool cache (once; later runs
      # find it there), and the download is checked against its own checksum
      # file so a job does not run a tarball it cannot identify.
      - name: Install grpcurl
        env:
          GRPCURL_VERSION: 1.9.3
        run: |
          set -euo pipefail
          dir="$RUNNER_TOOL_CACHE/grpcurl/$GRPCURL_VERSION"
          if [ ! -x "$dir/grpcurl" ]; then
            work=$(mktemp -d "$RUNNER_TEMP/grpcurl.XXXXXX")
            cd "$work"
            base="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}"
            curl -sSLf -o grpcurl.tar.gz "${base}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
            curl -sSLf -o grpcurl.sha256sum "${base}/grpcurl_${GRPCURL_VERSION}_checksums.txt"
            grep " grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz\$" grpcurl.sha256sum \
              | sed "s/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz/grpcurl.tar.gz/" \
              | sha256sum -c -
            tar -xzf grpcurl.tar.gz grpcurl
            mkdir -p "$dir"
            install -m 0755 grpcurl "$dir/grpcurl"
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/grpcurl" --version

      # A cancelled run does not reach `stop`, and the components it started
      # outlive the job; `start` then refuses to run beside them. Only this
      # runner's own binaries match (the pattern is its target directory),
      # and the runner user cannot signal anybody else's processes anyway.
      - name: Clear what a cancelled run left behind
        run: |
          pkill -f "${CARGO_TARGET_DIR}/debug/deis-" || true
          pkill -f "${CARGO_TARGET_DIR}/debug/examples/acme_test_ca" || true
          pkill -f "${GITHUB_WORKSPACE}/.demo/origin/origin.py" || true

      - name: Start the demo
        run: ./scripts/demo.sh start

      # The run this project's claims are quoted from. It prints one line of
      # evidence per check and ends with the tally and the roll call; a check
      # that fails, or a run that does not reach the number of checks the
      # script lists, exits non-zero.
      - name: Verify
        run: ./scripts/demo.sh verify

      - name: Stop the demo
        if: always()
        run: ./scripts/demo.sh stop || true

      # Every component's log, and the per-check transcripts `verify` leaves
      # behind. A failure here is a failure nobody can reproduce by reading
      # the job's output alone: the reason is in these files.
      - name: Keep the run's logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: demo-logs
          path: .demo/logs
          retention-days: 7
