<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Not found - Deislet demo</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <h1>Not found</h1>
    <p data-not-found="the-bundles-own-404-page">
      This page is the bundle's own 404.html. The project asks for
      "notFound": "404-page", so a path that names no file, matches no
      redirect rule and belongs to no function route is answered from here -
      with a 404 status, and without starting an isolate.
    </p>
  </body>
</html>
