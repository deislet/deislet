[package]
name = "deislet-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "integration_wire_control"
path = "integration_wire_control.rs"

[[bin]]
name = "integration_proxy_control"
path = "integration_proxy_control.rs"

[dependencies]
deis-wire = { path = "../crates/deis-wire" }
deis-proxy = { path = "../crates/deis-proxy" }
# Machine identity for the mutual-TLS migration replacing node_preshared_keys.
# Not called from this crate yet -- the dependency is being taken as its own
# reviewable step, ahead of the change that moves authentication over to it.
deis-identity = { path = "../crates/deis-identity" }
tokio = { version = "1", features = ["full"] }
